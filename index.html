  const targetDate = target === 'today' ? todayISO() : tomorrowISO();
  const targetLabel = target === 'today' ? 'היום' : 'מחר';

  // A client is "pending" if they have NO active order (not cancelled) for the target delivery date.
  const statuses = data.clients.map(c => {
    const activeOrders = data.orders.filter(o =>
      o.clientId === c.id &&
      o.status !== 'cancelled' &&
      o.deliveryDate === targetDate
    );
    return { client: c, hasOrder: activeOrders.length > 0, orders: activeOrders };
  });

  const pendingCount = statuses.filter(s => !s.hasOrder).length;
  const allClear = pendingCount === 0;

  return (
    <div className="bg-white rounded-xl border card-shadow mb-5 overflow-hidden"
         style={{ borderColor: '#E5E5E5' }}>
      <button onClick={() => setExpanded(!expanded)}
              className="w-full p-4 flex items-center gap-3 text-right hover:bg-neutral-50 transition-colors">
        <div className="w-11 h-11 rounded-lg flex items-center justify-center flex-shrink-0 text-white"
             style={{ background: allClear ? '#059669' : '#D21E26' }}>
          <BellRing size={20} />
        </div>
        <div className="flex-1 min-w-0">
          <div className="font-display text-base sm:text-lg font-bold" style={{ color: '#111111' }}>
            תזכורות לקוחות
          </div>
          <div className="text-xs sm:text-sm mt-0.5" style={{ color: allClear ? '#059669' : '#991B1B' }}>
            {allClear
              ? `כל הלקוחות שלחו הזמנות ל${targetLabel}`
              : `${pendingCount} ${pendingCount === 1 ? 'לקוח' : 'לקוחות'} טרם שלחו הזמנה ל${targetLabel}`}
          </div>
        </div>
        <ChevronLeft size={20}
                     style={{
                       color: '#737373',
                       transform: expanded ? 'rotate(-90deg)' : 'rotate(0deg)',
                       transition: 'transform 0.2s'
                     }}
                     className="flex-shrink-0" />
      </button>

      {expanded && (
        <div className="border-t p-4 fade-up" style={{ borderColor: '#E5E5E5', background: '#FAFAFA' }}>
          {/* Target selector */}
          <div className="flex gap-1.5 mb-3 items-center justify-between flex-wrap">
            <div className="flex gap-1.5">
              {[{id:'today',label:'היום'},{id:'tomorrow',label:'מחר'}].map(opt => {
                const active = target === opt.id;
                return (
                  <button key={opt.id}
                          onClick={() => setTarget(opt.id)}
                          className="px-3 py-1.5 rounded-full text-xs font-bold border transition-all"
                          style={{
                            background: active ? '#111111' : 'white',
                            color: active ? 'white' : '#525252',
                            borderColor: active ? '#111111' : '#E5E5E5',
                          }}>
                    {opt.label} <span className="opacity-60">· {formatDeliveryDate(opt.id === 'today' ? todayISO() : tomorrowISO())}</span>
                  </button>
                );
              })}
            </div>
            {(() => {
              const ordersForDate = data.orders.filter(o =>
                o.status !== 'cancelled' &&
                o.deliveryDate === targetDate
              );
              if (ordersForDate.length === 0) return null;
              const allPicked = ordersForDate.every(o => !!o.pickedAt);
              const pickedCount = ordersForDate.filter(o => !!o.pickedAt).length;
              return (
                <div className="flex gap-1.5 flex-wrap">
                  <button
                    onClick={() => printUnifiedPickingReport(ordersForDate, data.clients, data.products, targetDate)}
                    className="text-xs font-bold rounded-lg px-3 py-1.5 flex items-center gap-1.5 text-white"
                    style={{ background: '#B45309' }}
                    title="דוח ליקוט מאוחד מפוצל לעוף ובקר"
                  >
                    <ClipboardList size={13} />
                    דוח ליקוט מאוחד
                  </button>
                  <button
                    onClick={() => {
                      if (!allPicked) {
                        alert(`תעודת משלוח לקומקס תהיה זמינה לאחר ליקוט כל ההזמנות.\n\nכרגע נלקטו ${pickedCount} מתוך ${ordersForDate.length} הזמנות.`);
                        return;
                      }
                      exportUnifiedPickingToExcel(ordersForDate, data.clients, data.products, targetDate);
                    }}
                    disabled={!allPicked}
                    className="text-xs font-bold rounded-lg px-3 py-1.5 flex items-center gap-1.5 text-white"
                    style={{
                      background: allPicked ? '#059669' : '#A3A3A3',
                      cursor: allPicked ? 'pointer' : 'not-allowed',
                      opacity: allPicked ? 1 : 0.7,
                    }}
                    title={allPicked
                      ? "ייצוא תעודות משלוח לכל הלקוחות בקובץ אחד (גיליון לכל לקוח)"
                      : `יש להשלים ליקוט של ${ordersForDate.length - pickedCount} הזמנות נוספות`}
                  >
                    <FileSpreadsheet size={13} />
                    תעודות משלוח לקומקס
                    {!allPicked && <span className="text-[10px] opacity-90">({pickedCount}/{ordersForDate.length})</span>}
                  </button>
                  <button
                    onClick={() => printDriverSheet(ordersForDate, data.clients, data.products, targetDate)}
                    className="text-xs font-bold rounded-lg px-3 py-1.5 flex items-center gap-1.5 text-white"
                    style={{ background: '#111111' }}
                    title="הדפס דוח משלוח לנהג"
                  >
                    <Truck size={13} />
                    דוח נהג
                  </button>
                </div>
              );
            })()}
          </div>

          {/* Client list */}
          <div className="space-y-2">
            {statuses.map(({ client, hasOrder, orders }) => {
              const hasPhone = normalizeWhatsAppNumber(client.phone).length > 0;
              return (
                <div key={client.id}
                     className="flex items-center gap-3 p-2.5 rounded-lg bg-white border"
                     style={{ borderColor: '#E5E5E5' }}>
                  <ClientAvatar client={client} size="sm" />
                  <div className="flex-1 min-w-0">
                    <div className="font-display font-bold text-sm truncate" style={{ color: '#111111' }}>
                      {client.brand || client.name}
                    </div>
                    <div className="text-xs flex items-center gap-1.5 flex-wrap" style={{ color: hasOrder ? '#059669' : '#991B1B' }}>
                      {hasOrder ? (
                        <>
                          <Check size={12} />
                          <span className="font-semibold">{orders.length === 1 ? 'הזמנה נשלחה' : `${orders.length} הזמנות נשלחו`}</span>
                        </>
                      ) : (
                        <>
                          <AlertCircle size={12} />
                          <span className="font-semibold">טרם התקבלה הזמנה ל{targetLabel}</span>
                        </>
                      )}
                    </div>
                  </div>
                  {!hasOrder && (
                    hasPhone ? (
                      <button onClick={() => openWhatsAppReminder(client)}
                              className="rounded-lg px-3 py-2 text-xs font-bold text-white flex items-center gap-1.5 flex-shrink-0"
                              style={{ background: '#25D366' }}
                              title="שלח תזכורת ב-WhatsApp">
                        <Phone size={13} />
                        תזכורת
                      </button>
                    ) : (
                      <div className="text-[11px] text-center flex-shrink-0 px-2" style={{ color: '#A3A3A3' }}>
                        אין טלפון<br/>בכרטיס הלקוח
                      </div>
                    )
                  )}
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

/* ----- Admin: Orders ----- */

function AdminOrders({ data, saveData, categoryFilter, deptInfo }) {
  const [filter, setFilter] = useState('all');
  const [pickingOrderId, setPickingOrderId] = useState(null);
  const isWorker = !!categoryFilter;

  const filtered = useMemo(() => {
    let list = [...data.orders].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
    // Worker view: only orders that have items in our department
    if (categoryFilter) {
      list = list.filter(o =>
        o.items.some(it => itemMatchesCategory(it, data.products, categoryFilter))
      );
    }
    return filter === 'all' ? list : list.filter(o => o.status === filter);
  }, [data.orders, data.products, filter, categoryFilter]);

  // For status counts, also apply categoryFilter so the buttons show accurate numbers
  const statusBase = useMemo(() => {
    if (!categoryFilter) return data.orders;
    return data.orders.filter(o =>
      o.items.some(it => itemMatchesCategory(it, data.products, categoryFilter))
    );
  }, [data.orders, data.products, categoryFilter]);

  const filters = [
    { id: 'all',        label: 'הכל' },
    { id: 'pending',    label: 'חדשות' },
    { id: 'processing', label: 'בטיפול' },
    { id: 'shipped',    label: 'נשלחו' },
    { id: 'completed',  label: 'הושלמו' },
    { id: 'cancelled',  label: 'בוטלו' },
  ];

  const updateStatus = (orderId, newStatus) => {
    saveData({
      ...data,
      orders: data.orders.map(o => o.id === orderId ? { ...o, status: newStatus } : o)
    });
  };

  const deleteOrder = (orderId) => {
    if (!confirm('למחוק את ההזמנה? פעולה זו בלתי הפיכה.')) return;
    saveData({ ...data, orders: data.orders.filter(o => o.id !== orderId) });
  };

  const savePicked = (updatedOrder) => {
    saveData({
      ...data,
      orders: data.orders.map(o => o.id === updatedOrder.id ? updatedOrder : o)
    });
    setPickingOrderId(null);
  };

  const pickingOrder = pickingOrderId ? data.orders.find(o => o.id === pickingOrderId) : null;

  const titleLabel = isWorker
    ? `הזמנות ${deptInfo?.short || ''}`.trim()
    : 'כל ההזמנות';
  const subLabel = isWorker
    ? `${filtered.length} הזמנות פעילות עם פריטי ${deptInfo?.short || ''}`
    : `${data.orders.length} ${data.orders.length === 1 ? 'הזמנה' : 'הזמנות'} סה״כ`;

  return (
    <div>
      {/* ReminderPanel is admin-only; picking-floor workers don't need it */}
      {!isWorker && <ReminderPanel data={data} />}

      <div className="flex items-center justify-between mb-5 flex-wrap gap-3">
        <div>
          <h2 className="font-display text-2xl sm:text-3xl font-bold" style={{ color: '#111111' }}>{titleLabel}</h2>
          <p className="text-sm mt-1" style={{ color: '#737373' }}>{subLabel}</p>
        </div>
      </div>

      <div className="flex gap-1.5 mb-5 overflow-x-auto pb-1">
        {filters.map(f => {
          const count = f.id === 'all' ? statusBase.length : statusBase.filter(o => o.status === f.id).length;
          const active = filter === f.id;
          return (
            <button
              key={f.id}
              onClick={() => setFilter(f.id)}
              className="px-3 py-1.5 rounded-full text-sm font-semibold border whitespace-nowrap transition-colors"
              style={{
                background: active ? '#111111' : 'white',
                color: active ? 'white' : '#525252',
                borderColor: active ? '#111111' : '#E5E5E5',
              }}
            >
              {f.label} <span className="opacity-60">({count})</span>
            </button>
          );
        })}
      </div>

      {filtered.length === 0 ? (
        <EmptyState icon={Receipt} title="אין הזמנות" description={
          isWorker
            ? `אין כרגע הזמנות עם פריטי ${deptInfo?.short || 'מחלקה זו'}`
            : 'כאן יופיעו הזמנות שהלקוחות ישלחו'
        } />
      ) : (
        <div className="space-y-3">
          {filtered.map(order => (
            <OrderCardAdmin
              key={order.id}
              order={order}
              data={data}
              onStatusChange={(s) => updateStatus(order.id, s)}
              onDelete={() => deleteOrder(order.id)}
              onPick={() => setPickingOrderId(order.id)}
              categoryFilter={categoryFilter}
              deptInfo={deptInfo}
            />
          ))}
        </div>
      )}

      {pickingOrder && (
        <PickingModal
          order={pickingOrder}
          data={data}
          onClose={() => setPickingOrderId(null)}
          onSave={savePicked}
          categoryFilter={categoryFilter}
          deptInfo={deptInfo}
        />
      )}
    </div>
  );
}

function OrderCardAdmin({ order, data, onStatusChange, onDelete, onPick, categoryFilter, deptInfo }) {
  const [open, setOpen] = useState(false);
  const client = data.clients.find(c => c.id === order.clientId);
  const isWorker = !!categoryFilter;
  // For workers: only show items in their department
  const visibleItems = isWorker
    ? order.items.filter(it => itemMatchesCategory(it, data.products, categoryFilter))
    : order.items;
  const itemCount = visibleItems.reduce((s, i) => s + i.quantity, 0);
  const isPicked = !!order.pickedAt;
  const pickingAllowed = order.status !== 'cancelled';

  const nextStatuses = ['pending', 'processing', 'shipped', 'completed', 'cancelled'];

  return (
    <div className="bg-white rounded-xl border overflow-hidden card-shadow"
         style={{ borderColor: '#E5E5E5' }}>
      <button
        onClick={() => setOpen(!open)}
        className="w-full p-4 flex items-center gap-3 text-right hover:bg-neutral-50 transition-colors"
      >
        <ClientAvatar client={client} size="md" />
        <div className="flex-1 min-w-0">
          <div className="flex items-center gap-2 flex-wrap">
            {client?.brand && (
              <span className="font-display text-lg font-bold truncate" style={{ color: '#111111' }}>
                {client.brand}
              </span>
            )}
            <span className="text-xs truncate" style={{ color: '#737373' }}>
              {client?.name || 'לקוח לא ידוע'}
            </span>
            <StatusPill status={order.status} size="sm" />
            {isPicked && (
              <span className="inline-flex items-center gap-1 font-bold rounded-full border text-[11px] px-2 py-[2px]"
                    style={{ background: '#FEF2F2', color: '#991B1B', borderColor: '#FCA5A5' }}>
                <Scale size={11} />
                נלקט
              </span>
            )}
            {order.updatedAt && !isPicked && (
              <span className="inline-flex items-center gap-1 font-bold rounded-full border text-[11px] px-2 py-[2px]"
                    style={{ background: '#FEF9C3', color: '#78350F', borderColor: '#FDE68A' }}>
                <Edit3 size={11} />
                עודכנה
              </span>
            )}
          </div>
          <div className="text-xs sm:text-sm flex items-center gap-2 mt-0.5 flex-wrap" style={{ color: '#737373' }}>
            {client?.companyId && <span className="font-mono">#{client.companyId}</span>}
            {client?.companyId && <span>·</span>}
            <span>{formatDate(order.createdAt)}</span>
            <span>·</span>
            <span>{itemCount} {itemCount === 1 ? 'פריט' : 'פריטים'}</span>
          </div>
          {(order.ordererName || order.deliveryDate) && (
            <div className="text-xs mt-1 flex items-center gap-2 flex-wrap font-semibold" style={{ color: '#525252' }}>
              {order.ordererName && (
                <span className="inline-flex items-center gap-1">
                  <UserCircle size={12} /> {order.ordererName}
                </span>
              )}
              {order.ordererName && order.deliveryDate && <span>·</span>}
              {order.deliveryDate && (() => {
                const [y,m,d] = order.deliveryDate.split('-');
                let s = `${d}/${m}/${y}`;
                if (order.deliveryTime) s += ` · ${order.deliveryTime}`;
                return (
                  <span className="inline-flex items-center gap-1" style={{ color: '#D21E26' }}>
                    <Calendar size={12} /> {s}
                  </span>
                );
              })()}
            </div>
          )}
        </div>
        <div className="text-left flex-shrink-0">
          <div className="text-xs" style={{ color: '#A3A3A3' }}>#{order.id.slice(0, 5).toUpperCase()}</div>
        </div>
      </button>

      {/* Collapsed-state Quick-pick button for unpicked orders */}
      {!open && !isPicked && pickingAllowed && (
        <div className="px-4 pb-3 -mt-1">
          <button onClick={onPick}
                  className="btn-primary w-full rounded-lg px-4 py-2.5 text-sm font-bold flex items-center justify-center gap-2">
            <Scale size={16} />
            התחל ליקוט
          </button>
        </div>
      )}

      {open && (
        <div className="border-t p-4 fade-up"
             style={{ borderColor: '#E5E5E5', background: '#FAFAFA' }}>

          {/* Order-level note from client */}
          {order.notes && (
            <div className="mb-4 p-3 rounded-lg border flex gap-2"
                 style={{ background: '#FEF2F2', borderColor: '#FCA5A5' }}>
              <MessageSquare size={15} style={{ color: '#991B1B' }} className="flex-shrink-0 mt-0.5" />
              <div className="text-sm" style={{ color: '#991B1B' }}>
                <div className="font-bold text-xs mb-0.5">הערה כללית מהלקוח:</div>
                {order.notes}
              </div>
            </div>
          )}

          <div className="space-y-2 mb-4">
            {isWorker && (
              <div className="mb-3 px-3 py-2 rounded-lg text-xs font-bold flex items-center gap-2"
                   style={{ background: deptInfo?.bg || '#FEF3C7', color: deptInfo?.accent || '#B45309' }}>
                <span className="text-base">{deptInfo?.emoji || '📦'}</span>
                <span>מציג רק פריטי {deptInfo?.short || 'מחלקתך'} מהזמנה זו ({visibleItems.length} {visibleItems.length === 1 ? 'פריט' : 'פריטים'})</span>
              </div>
            )}
            {visibleItems.map(item => {
              const p = data.products.find(pr => pr.id === item.productId);
              const hasPicked = item.pickedQty != null;
              const diff = hasPicked ? item.pickedQty - item.quantity : 0;
              return (
                <div key={item.productId}
                     className="py-2 border-b last:border-0"
                     style={{ borderColor: '#E5E5E5' }}>
                  <div className="flex items-center gap-3">
                    <div className="w-9 h-9 rounded-lg bg-white border flex items-center justify-center text-lg flex-shrink-0"
                         style={{ borderColor: '#E5E5E5' }}>
                      {p?.emoji || '📦'}
                    </div>
                    <div className="flex-1 min-w-0">
                      <div className="text-sm font-bold" style={{ color: '#111111' }}>
                        {p?.name || 'מוצר שנמחק'}
                      </div>
                      <div className="text-xs flex items-center gap-1.5 flex-wrap" style={{ color: '#737373' }}>
                        {p?.sku && <span className="font-mono" dir="ltr">#{p.sku}</span>}
                        {p?.sku && p?.unit && <span>·</span>}
                        {p?.unit && <span>{p.unit}</span>}
                      </div>
                    </div>
                    <div className="text-left flex-shrink-0">
                      {hasPicked ? (
                        <>
                          <div className="text-xs" style={{ color: '#737373' }}>
                            הוזמן: <span className="font-bold">{item.quantity}</span>
                          </div>
                          <div className="font-display font-bold text-base" style={{ color: '#D21E26' }}>
                            נשלח: {item.pickedQty} {p?.unit || ''}
                          </div>
                          {diff !== 0 && (
                            <div className="text-[11px] font-bold"
                                 style={{ color: diff > 0 ? '#059669' : '#B45309' }}>
                              {diff > 0 ? '+' : ''}{Number(diff.toFixed(3))}
                            </div>
                          )}
                        </>
                      ) : (
                        <div className="font-display font-bold text-lg" style={{ color: '#111111' }}>
                          × {item.quantity}
                        </div>
                      )}
                    </div>
                  </div>
                  {item.note && (
                    <div className="mt-1.5 mr-12 text-xs flex items-center gap-1.5 px-2 py-1 rounded"
                         style={{ color: '#991B1B', background: '#FEF2F2' }}>
                      <MessageSquare size={11} className="flex-shrink-0" />
                      <span className="italic font-semibold">{item.note}</span>
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          {/* Pick button inside expanded view */}
          {pickingAllowed && (
            <button onClick={onPick}
                    className={`${isPicked ? 'btn-dark' : 'btn-primary'} w-full rounded-lg px-4 py-2.5 text-sm font-bold flex items-center justify-center gap-2 mb-4`}>
              <Scale size={16} />
              {isPicked ? 'עריכת ליקוט' : 'התחל ליקוט'}
            </button>
          )}

          <div className="mb-3">
            <div className="text-xs font-bold mb-2" style={{ color: '#737373' }}>שנה סטטוס:</div>
            <div className="flex flex-wrap gap-1.5">
              {nextStatuses.map(s => {
                const active = order.status === s;
                const st = STATUS[s];
                return (
                  <button
                    key={s}
                    onClick={() => onStatusChange(s)}
                    className="px-3 py-1.5 rounded-full text-xs font-semibold border transition-all flex items-center gap-1.5"
                    style={{
                      background: active ? st.fg : 'white',
                      color: active ? 'white' : st.fg,
                      borderColor: active ? st.fg : st.border,
                    }}
                  >
                    <st.icon size={12} />
                    {st.label}
                  </button>
                );
              })}
            </div>
          </div>

          <div className="flex justify-between items-center pt-3 border-t gap-2 flex-wrap"
               style={{ borderColor: '#E5E5E5' }}>
            <div className="flex-1" />
            <div className="flex items-center gap-2 flex-wrap">
              <button
                onClick={() => printPickingReportForOrder(order, client, data.products)}
                className="text-sm rounded-lg px-3 py-1.5 border bg-white hover:bg-neutral-50 font-semibold flex items-center gap-1.5"
                style={{ color: '#B45309', borderColor: '#FCD34D' }}
              >
                <ClipboardList size={14} />
                דוח ליקוט
              </button>
              {isPicked && (
                <button
                  onClick={() => printLabelsForOrder(order, client, data.products)}
                  className="text-sm rounded-lg px-3 py-1.5 border bg-white hover:bg-neutral-50 font-semibold flex items-center gap-1.5"
                  style={{ color: '#6B21A8', borderColor: '#D8B4FE' }}
                  title="מדבקות קרטון 10x10 ס״מ — אחת לכל פריט"
                >
                  <Printer size={14} />
                  מדבקות קרטון
                </button>
              )}
              {isPicked && (
                <button
                  onClick={() => printItemLabelsForOrder(order, client, data.products)}
                  className="text-sm rounded-lg px-3 py-1.5 border bg-white hover:bg-neutral-50 font-semibold flex items-center gap-1.5"
                  style={{ color: '#1E40AF', borderColor: '#93C5FD' }}
                  title="מדבקות פריט 5x5 ס״מ — אחת לכל יחידה בודדת"
                >
                  <Printer size={14} />
                  מדבקות פריט
                </button>
              )}
              {isPicked && !isWorker && (
                <button
                  onClick={() => exportPickingToExcel(order, client, data.products)}
                  className="text-sm rounded-lg px-3 py-1.5 border bg-white hover:bg-neutral-50 font-semibold flex items-center gap-1.5"
                  style={{ color: '#059669', borderColor: '#86EFAC' }}
                >
                  <FileSpreadsheet size={14} />
                  ייצוא לאקסל
                </button>
              )}
              <button
                onClick={() => setOpen(false)}
                className="text-sm font-semibold"
                style={{ color: '#525252' }}
              >
                סגור
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ----- Admin: Products ----- */

function AdminProducts({ data, saveData }) {
  const [editing, setEditing] = useState(null);
  const [selectedClient, setSelectedClient] = useState(data.clients[0]?.id || 'c1');
  const [view, setView] = useState('active');           // 'active' | 'archived'
  const [deptFilter, setDeptFilter] = useState('all');  // 'all' | 'chicken' | 'beef' | 'other'
  const [search, setSearch] = useState('');
  const [sortBy, setSortBy] = useState('name');         // 'name' | 'sku' | 'category'
  const [selectedIds, setSelectedIds] = useState(new Set());
  const [inlineEditing, setInlineEditing] = useState(null);  // { id, field } e.g. {id:'p1-X', field:'name'}

  const allClientProducts = data.products.filter(p => p.clientId === selectedClient);
  const activeProducts = allClientProducts.filter(p => !p.archived);
  const archivedProducts = allClientProducts.filter(p => p.archived);
  const baseList = view === 'active' ? activeProducts : archivedProducts;

  // Apply department filter + search
  let filtered = baseList.filter(p => deptFilter === 'all' || classifyProduct(p) === deptFilter);
  if (search.trim()) {
    const q = search.trim().toLowerCase();
    filtered = filtered.filter(p =>
      p.name.toLowerCase().includes(q) ||
      (p.sku && p.sku.toLowerCase().includes(q)) ||
      (p.description && p.description.toLowerCase().includes(q))
    );
  }
  // Sort
  filtered = [...filtered].sort((a, b) => {
    if (sortBy === 'sku')      return (a.sku || '').localeCompare(b.sku || '', 'he');
    if (sortBy === 'category') {
      const ca = classifyProduct(a), cb = classifyProduct(b);
      const order = { chicken: 0, beef: 1, other: 2 };
      if (ca !== cb) return order[ca] - order[cb];
      return a.name.localeCompare(b.name, 'he');
    }
    return a.name.localeCompare(b.name, 'he');
  });

  const currentClient = data.clients.find(c => c.id === selectedClient);

  // Reset selection when changing view/client/dept
  useEffect(() => { setSelectedIds(new Set()); setInlineEditing(null); }, [selectedClient, view, deptFilter]);

  const saveProduct = (product) => {
    if (product.id && data.products.find(p => p.id === product.id)) {
      saveData({ ...data, products: data.products.map(p => p.id === product.id ? product : p) });
    } else {
      saveData({ ...data, products: [...data.products, { ...product, id: uid() }] });
    }
    setEditing(null);
  };

  // Inline update — patch a field on a product
  const patchProduct = (id, patch) => {
    saveData({
      ...data,
      products: data.products.map(p => p.id === id ? { ...p, ...patch } : p)
    });
  };

  const archiveProduct = (id) => {
    patchProduct(id, { archived: true, archivedAt: new Date().toISOString() });
  };
  const restoreProduct = (id) => {
    saveData({
      ...data,
      products: data.products.map(p => {
        if (p.id !== id) return p;
        const { archived, archivedAt, ...rest } = p;
        return rest;
      })
    });
  };
  const deleteProduct = (id) => {
    if (!confirm('למחוק את המוצר לצמיתות? פעולה זו בלתי הפיכה.')) return;
    saveData({ ...data, products: data.products.filter(p => p.id !== id) });
  };

  // Bulk operations
  const toggleSelect = (id) => {
    setSelectedIds(prev => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id); else next.add(id);
      return next;
    });
  };
  const selectAll = () => {
    if (selectedIds.size === filtered.length) setSelectedIds(new Set());
    else setSelectedIds(new Set(filtered.map(p => p.id)));
  };
  const bulkArchive = () => {
    if (selectedIds.size === 0) return;
    if (!confirm(`להעביר ${selectedIds.size} מוצרים לארכיון?`)) return;
    saveData({
      ...data,
      products: data.products.map(p =>
        selectedIds.has(p.id) ? { ...p, archived: true, archivedAt: new Date().toISOString() } : p
      )
    });
    setSelectedIds(new Set());
  };
  const bulkRestore = () => {
    if (selectedIds.size === 0) return;
    saveData({
      ...data,
      products: data.products.map(p => {
        if (!selectedIds.has(p.id)) return p;
        const { archived, archivedAt, ...rest } = p;
        return rest;
      })
    });
    setSelectedIds(new Set());
  };
  const bulkSetCategory = (cat) => {
    if (selectedIds.size === 0) return;
    saveData({
      ...data,
      products: data.products.map(p =>
        selectedIds.has(p.id) ? { ...p, category: cat } : p
      )
    });
    setSelectedIds(new Set());
  };

  const counts = {
    all: baseList.length,
    chicken: baseList.filter(p => classifyProduct(p) === 'chicken').length,
    beef: baseList.filter(p => classifyProduct(p) === 'beef').length,
    other: baseList.filter(p => classifyProduct(p) === 'other').length,
  };

  return (
    <div>
      <div className="flex items-center justify-between mb-5 flex-wrap gap-3">
        <div>
          <h2 className="font-display text-2xl sm:text-3xl font-bold" style={{ color: '#111111' }}>קטלוגי מוצרים</h2>
          <p className="text-sm mt-1" style={{ color: '#737373' }}>
            {filtered.length} מוצרים בתצוגה{search || deptFilter !== 'all' ? ` · מתוך ${baseList.length}` : ''}
          </p>
        </div>
        <button
          onClick={() => setEditing({
            emoji: '🥩', name: '', description: '',
            unit: 'ק״ג', sku: '', clientId: selectedClient,
            category: deptFilter === 'all' ? 'other' : deptFilter,
          })}
          className="btn-primary rounded-lg px-4 py-2.5 font-semibold text-sm flex items-center gap-2"
        >
          <Plus size={17} />
          מוצר חדש
        </button>
      </div>

      {/* Client selector */}
      <div className="flex gap-2 mb-4 overflow-x-auto pb-1">
        {data.clients.map(c => {
          const count = data.products.filter(p => p.clientId === c.id && !p.archived).length;
          const active = selectedClient === c.id;
          const label = c.brand || c.name;
          return (
            <button
              key={c.id}
              onClick={() => { setSelectedClient(c.id); setDeptFilter('all'); setSearch(''); }}
              className="px-3 py-2 rounded-lg text-sm font-semibold border whitespace-nowrap transition-all flex items-center gap-2"
              style={{
                background: active ? c.color : 'white',
                color: active ? 'white' : '#111111',
                borderColor: active ? c.color : '#E5E5E5',
              }}
            >
              {c.logo ? (
                <span className="w-6 h-6 rounded overflow-hidden flex-shrink-0 bg-white border"
                      style={{ borderColor: active ? 'rgba(255,255,255,0.5)' : '#E5E5E5' }}>
                  <img src={c.logo} alt="" className="w-full h-full object-cover block" />
                </span>
              ) : (
                <span className="w-6 h-6 rounded flex items-center justify-center text-xs font-display font-bold flex-shrink-0"
                      style={{ background: active ? 'rgba(255,255,255,0.22)' : c.color, color: 'white' }}>
                  {c.name.charAt(0)}
                </span>
              )}
              <span className="max-w-[160px] truncate">{label}</span>
              <span className="text-xs opacity-75">({count})</span>
            </button>
          );
        })}
      </div>

      {/* Active / Archived toggle */}
      <div className="flex items-center gap-2 mb-3 border-b pb-3" style={{ borderColor: '#E5E5E5' }}>
        <button onClick={() => setView('active')}
                className="px-3 py-1.5 rounded-lg text-sm font-semibold flex items-center gap-1.5 transition-colors"
                style={{
                  background: view === 'active' ? '#111111' : 'transparent',
                  color: view === 'active' ? 'white' : '#525252',
                }}>
          <Package size={14} />
          פעילים ({activeProducts.length})
        </button>
        <button onClick={() => setView('archived')}
                className="px-3 py-1.5 rounded-lg text-sm font-semibold flex items-center gap-1.5 transition-colors"
                style={{
                  background: view === 'archived' ? '#525252' : 'transparent',
                  color: view === 'archived' ? 'white' : '#525252',
                }}>
          <Archive size={14} />
          ארכיון ({archivedProducts.length})
        </button>
      </div>

      {/* Search + sort row */}
      <div className="flex gap-2 mb-3 flex-wrap items-center">
        <div className="relative flex-1 min-w-[200px]">
          <Search size={16} className="absolute top-1/2 -translate-y-1/2 right-3 pointer-events-none" style={{ color: '#A3A3A3' }} />
          <input
            value={search}
            onChange={e => setSearch(e.target.value)}
            placeholder="חיפוש לפי שם או מק״ט..."
            className="input-field w-full rounded-lg pr-9 pl-3 py-2 text-sm"
          />
          {search && (
            <button onClick={() => setSearch('')}
                    className="absolute top-1/2 -translate-y-1/2 left-2 p-1 rounded hover:bg-neutral-100">
              <X size={14} style={{ color: '#737373' }} />
            </button>
          )}
        </div>
        <select
          value={sortBy}
          onChange={e => setSortBy(e.target.value)}
          className="input-field rounded-lg px-3 py-2 text-sm"
          title="מיון"
        >
          <option value="name">מיון: שם</option>
          <option value="sku">מיון: מק״ט</option>
          <option value="category">מיון: קטגוריה</option>
        </select>
      </div>

      {/* Department filter pills */}
      <div className="flex gap-1.5 mb-4 overflow-x-auto pb-1">
        {[
          { id: 'all',     label: 'הכל',   emoji: null,  count: counts.all,     color: '#111111' },
          { id: 'chicken', label: 'עוף',   emoji: '🍗',  count: counts.chicken, color: '#B45309' },
          { id: 'beef',    label: 'בקר',   emoji: '🥩',  count: counts.beef,    color: '#991B1B' },
          { id: 'other',   label: 'אחר',   emoji: '📦',  count: counts.other,   color: '#525252' },
        ].map(opt => {
          const active = deptFilter === opt.id;
          return (
            <button key={opt.id}
                    onClick={() => setDeptFilter(opt.id)}
                    className="px-3 py-1.5 rounded-full text-sm font-semibold border whitespace-nowrap transition-colors flex items-center gap-1.5"
                    style={{
                      background: active ? opt.color : 'white',
                      color: active ? 'white' : '#525252',
                      borderColor: active ? opt.color : '#E5E5E5',
                    }}>
              {opt.emoji && <span>{opt.emoji}</span>}
              <span>{opt.label}</span>
              <span className="opacity-70">({opt.count})</span>
            </button>
          );
        })}
      </div>

      {/* Bulk action bar — sticky when items are selected */}
      {selectedIds.size > 0 && (
        <div className="sticky top-2 z-10 mb-3 rounded-xl border p-2.5 card-shadow flex items-center gap-2 flex-wrap fade-up"
             style={{ background: '#111111', borderColor: '#111111' }}>
          <span className="text-sm font-bold text-white px-2">
            {selectedIds.size} {selectedIds.size === 1 ? 'נבחר' : 'נבחרו'}
          </span>
          {view === 'active' ? (
            <>
              <button onClick={() => bulkSetCategory('chicken')}
                      className="text-xs font-bold rounded-md px-2.5 py-1.5 flex items-center gap-1"
                      style={{ background: '#FEF3C7', color: '#B45309' }}>
                🍗 עוף
              </button>
              <button onClick={() => bulkSetCategory('beef')}
                      className="text-xs font-bold rounded-md px-2.5 py-1.5 flex items-center gap-1"
                      style={{ background: '#FEE2E2', color: '#991B1B' }}>
                🥩 בקר
              </button>
              <button onClick={() => bulkSetCategory('other')}
                      className="text-xs font-bold rounded-md px-2.5 py-1.5 flex items-center gap-1"
                      style={{ background: '#E5E5E5', color: '#525252' }}>
                📦 אחר
              </button>
              <button onClick={bulkArchive}
                      className="text-xs font-bold rounded-md px-2.5 py-1.5 flex items-center gap-1 text-white border"
                      style={{ background: 'transparent', borderColor: 'rgba(255,255,255,0.3)' }}>
                <Archive size={12} /> ארכיון
              </button>
            </>
          ) : (
            <button onClick={bulkRestore}
                    className="text-xs font-bold rounded-md px-2.5 py-1.5 flex items-center gap-1"
                    style={{ background: '#D1FAE5', color: '#065F46' }}>
              <ArchiveRestore size={12} /> שחזור
            </button>
          )}
          <div className="flex-1" />
          <button onClick={() => setSelectedIds(new Set())}
                  className="text-xs font-semibold text-white opacity-70 hover:opacity-100 px-2">
            ביטול
          </button>
        </div>
      )}

      {/* "Select all" toggle when there are products */}
      {filtered.length > 0 && (
        <div className="flex items-center gap-2 mb-2 px-1">
          <button onClick={selectAll}
                  className="text-xs font-semibold flex items-center gap-1.5 hover:underline"
                  style={{ color: '#525252' }}>
            <input type="checkbox"
                   checked={selectedIds.size === filtered.length && filtered.length > 0}
                   onChange={selectAll}
                   style={{ accentColor: '#D21E26' }} />
            בחר הכל
          </button>
        </div>
      )}

      {filtered.length === 0 ? (
        <EmptyState
          icon={view === 'archived' ? Archive : Package}
          title={
            search
              ? `לא נמצאו תוצאות עבור "${search}"`
              : view === 'archived'
              ? 'הארכיון ריק'
              : `אין מוצרים ${deptFilter !== 'all' ? `במחלקת ${deptFilter === 'chicken' ? 'עוף' : deptFilter === 'beef' ? 'בקר' : 'אחר'}` : `עבור ${currentClient?.brand || currentClient?.name || 'הלקוח'}`}`
          }
          description={
            view === 'archived'
              ? 'מוצרים שתעביר לארכיון יופיעו כאן'
              : 'לחץ על ״מוצר חדש״ כדי להוסיף מוצר ראשון'
          }
        />
      ) : (
        <div className="space-y-2">
          {filtered.map(p => (
            <ProductRow
              key={p.id}
              product={p}
              isSelected={selectedIds.has(p.id)}
              isArchived={view === 'archived'}
              inlineEditing={inlineEditing}
              setInlineEditing={setInlineEditing}
              onToggleSelect={() => toggleSelect(p.id)}
              onPatch={(patch) => patchProduct(p.id, patch)}
              onOpenEditor={() => setEditing(p)}
              onArchive={() => archiveProduct(p.id)}
              onRestore={() => restoreProduct(p.id)}
              onDelete={() => deleteProduct(p.id)}
            />
          ))}
        </div>
      )}

      {editing && (
        <ProductEditor
          product={editing}
          clients={data.clients}
          onSave={saveProduct}
          onCancel={() => setEditing(null)}
        />
      )}
    </div>
  );
}

/* ----- Single product row with inline editing ----- */
function ProductRow({
  product, isSelected, isArchived, inlineEditing, setInlineEditing,
  onToggleSelect, onPatch, onOpenEditor, onArchive, onRestore, onDelete
}) {
  const cls = classifyProduct(product);
  const expiry = getExpiryInfo(product.productionDate, product);

  const isEditingName = inlineEditing?.id === product.id && inlineEditing?.field === 'name';
  const isEditingSku  = inlineEditing?.id === product.id && inlineEditing?.field === 'sku';

  const [draftName, setDraftName] = useState(product.name);
  const [draftSku, setDraftSku] = useState(product.sku || '');

  // Sync drafts when product changes
  useEffect(() => { setDraftName(product.name); }, [product.name]);
  useEffect(() => { setDraftSku(product.sku || ''); }, [product.sku]);

  const saveName = () => {
    const trimmed = draftName.trim();
    if (trimmed && trimmed !== product.name) onPatch({ name: trimmed });
    setInlineEditing(null);
  };
  const saveSku = () => {
    const trimmed = draftSku.trim();
    if (trimmed !== (product.sku || '')) onPatch({ sku: trimmed });
    setInlineEditing(null);
  };

  return (
    <div className="bg-white rounded-xl border card-shadow flex items-center gap-3 p-3"
         style={{
           borderColor: isSelected ? '#D21E26' : '#E5E5E5',
           background: isSelected ? '#FEF2F2' : (isArchived ? '#FAFAFA' : 'white'),
           opacity: isArchived ? 0.85 : 1,
         }}>
      {/* Checkbox */}
      <input type="checkbox"
             checked={isSelected}
             onChange={onToggleSelect}
             className="flex-shrink-0 w-4 h-4 cursor-pointer"
             style={{ accentColor: '#D21E26' }} />

      {/* Emoji avatar */}
      <div className="w-11 h-11 rounded-lg flex items-center justify-center text-2xl flex-shrink-0"
           style={{ background: '#FEF2F2' }}>
        {product.emoji}
      </div>

      {/* Main info — name (editable) + meta */}
      <div className="flex-1 min-w-0">
        {/* Name (inline editable) */}
        {isEditingName ? (
          <input
            autoFocus
            value={draftName}
            onChange={e => setDraftName(e.target.value)}
            onBlur={saveName}
            onKeyDown={e => {
              if (e.key === 'Enter') saveName();
              if (e.key === 'Escape') { setDraftName(product.name); setInlineEditing(null); }
            }}
            className="font-display font-bold text-base leading-tight bg-white outline-none w-full rounded px-1 py-0.5"
            style={{ border: '1px solid #D21E26', color: '#111111' }}
          />
        ) : (
          <div onClick={() => !isArchived && setInlineEditing({ id: product.id, field: 'name' })}
               className={`font-display font-bold text-base leading-tight inline-block ${!isArchived ? 'cursor-text hover:bg-neutral-50 rounded px-1' : ''}`}
               style={{ color: '#111111' }}
               title={!isArchived ? 'לחץ לעריכה' : ''}>
            {product.name}
          </div>
        )}

        {/* Meta row: SKU + category + unit + expiry */}
        <div className="flex items-center gap-1.5 flex-wrap mt-1">
          {/* SKU (inline editable) */}
          {isEditingSku ? (
            <input
              autoFocus
              value={draftSku}
              onChange={e => setDraftSku(e.target.value)}
              onBlur={saveSku}
              onKeyDown={e => {
                if (e.key === 'Enter') saveSku();
                if (e.key === 'Escape') { setDraftSku(product.sku || ''); setInlineEditing(null); }
              }}
              className="text-xs font-mono bg-white outline-none rounded px-1 w-24"
              style={{ border: '1px solid #D21E26', direction: 'ltr', color: '#111111' }}
              dir="ltr"
            />
          ) : (
            <span onClick={() => !isArchived && setInlineEditing({ id: product.id, field: 'sku' })}
                  className={`text-xs font-mono px-1.5 py-0.5 rounded ${!isArchived ? 'cursor-text hover:opacity-80' : ''}`}
                  style={{ background: '#FEF2F2', color: '#991B1B' }}
                  dir="ltr"
                  title={!isArchived ? 'לחץ לעריכה' : ''}>
              {product.sku ? `#${product.sku}` : '— ללא מק״ט —'}
            </span>
          )}

          {/* Category dropdown — direct, inline */}
          {!isArchived ? (
            <select
              value={cls}
              onChange={e => onPatch({ category: e.target.value })}
              className="text-xs font-semibold px-1.5 py-0.5 rounded border-0 cursor-pointer outline-none"
              style={{
                background: cls === 'chicken' ? '#FEF3C7' : cls === 'beef' ? '#FEE2E2' : '#E5E5E5',
                color: cls === 'chicken' ? '#B45309' : cls === 'beef' ? '#991B1B' : '#525252',
              }}
              title="שינוי קטגוריה"
            >
              <option value="chicken">🍗 עוף</option>
              <option value="beef">🥩 בקר</option>
              <option value="other">📦 אחר</option>
            </select>
          ) : (
            <span className="text-xs font-semibold px-1.5 py-0.5 rounded inline-flex items-center gap-1"
                  style={{
                    background: cls === 'chicken' ? '#FEF3C7' : cls === 'beef' ? '#FEE2E2' : '#E5E5E5',
                    color: cls === 'chicken' ? '#B45309' : cls === 'beef' ? '#991B1B' : '#525252',
                  }}>
              {cls === 'chicken' ? '🍗 עוף' : cls === 'beef' ? '🥩 בקר' : '📦 אחר'}
            </span>
          )}

          {/* Order + billing unit tags */}
          {(() => {
            const ou = getOrderUnit(product);
            const bu = getBillingUnit(product);
            const sameUnit = ou === bu;
            return (
              <span className="text-xs font-semibold px-1.5 py-0.5 rounded inline-flex items-center gap-1"
                    style={{ background: '#EFF6FF', color: '#1E40AF', border: '1px solid #BFDBFE' }}
                    title={sameUnit
                      ? `מוזמן ומחויב ב${ou === 'kg' ? 'ק״ג' : 'יחידות'}`
                      : `מוזמן ב${ou === 'kg' ? 'ק״ג' : 'יחידות'} · מחויב ב${bu === 'kg' ? 'ק״ג' : 'יחידות'}`}>
                {ou === 'kg' ? '⚖️' : '🔢'}
                {!sameUnit && <>→ {bu === 'kg' ? '⚖️' : '🔢'}</>}
                {sameUnit
                  ? (ou === 'kg' ? 'ק״ג' : 'יח׳')
                  : `${ou === 'kg' ? 'ק״ג' : 'יח׳'}→${bu === 'kg' ? 'ק״ג' : 'יח׳'}`}
              </span>
            );
          })()}

          {/* Expiry warning if relevant */}
          {(expiry.status === 'soon' || expiry.status === 'expired') && (
            <span className="text-xs font-semibold px-1.5 py-0.5 rounded inline-flex items-center gap-1"
                  style={{ background: expiry.bg, color: expiry.color, border: `1px solid ${expiry.border}` }}>
              <Calendar size={10} /> {expiry.label}
            </span>
          )}
        </div>
      </div>

      {/* Action buttons */}
      <div className="flex gap-1 flex-shrink-0">
        {isArchived ? (
          <>
            <button onClick={onRestore}
                    className="p-2 rounded-lg hover:bg-green-50" title="שחזור">
              <ArchiveRestore size={16} style={{ color: '#059669' }} />
            </button>
            <button onClick={onDelete}
                    className="p-2 rounded-lg hover:bg-red-50" title="מחיקה לצמיתות">
              <Trash2 size={16} style={{ color: '#B91C1C' }} />
            </button>
          </>
        ) : (
          <>
            <button onClick={onOpenEditor}
                    className="p-2 rounded-lg hover:bg-neutral-100" title="עריכה מלאה">
              <Pencil size={16} style={{ color: '#525252' }} />
            </button>
            <button onClick={onArchive}
                    className="p-2 rounded-lg hover:bg-neutral-100" title="העברה לארכיון">
              <Archive size={16} style={{ color: '#525252' }} />
            </button>
          </>
        )}
      </div>
    </div>
  );
}


function ProductEditor({ product, clients, onSave, onCancel }) {
  const [form, setForm] = useState(product);
  const isNew = !product.id;

  const emojiOptions = [
    '🥩','🍗','🐑','🦆','🐟','🍢','🫀','🥓','🍖','🦴',

            <div className="p-2 rounded-lg text-xs flex items-start gap-2"
                 style={{ background: '#FEF3C7', color: '#78350F', border: '1px solid #FDE68A' }}>
              <span>💡</span>
              <span>מצב הזמנה ביחידות + חיוב בק״ג: הלקוח מזמין מספר יחידות, המנהל שוקל בליקוט ומזין משקל סופי לחיוב.</span>

          {/* Production date with auto-expiry preview */}
          {(() => {
            const cls = classifyProduct(form);
            const days = SHELF_LIFE_DAYS[cls] || 0;
            const showField = days > 0;
            if (!showField) return null;
            const expiryInfo = form.productionDate ? getExpiryInfo(form.productionDate, form) : null;
            return (

                />
                {expiryInfo && expiryInfo.status !== 'none' && (
                  <div className="mt-2 px-3 py-2 rounded-lg text-xs font-semibold flex items-center gap-2"
                       style={{

                       }}>
                    <Calendar size={12} />
                    תוקף עד {expiryInfo.expiry && (() => {
                      const [y,m,d] = expiryInfo.expiry.split('-');
                      return `${d}/${m}/${y}`;
                    })()} · {expiryInfo.label}
                  </div>
                )}

            );
          })()}
        </div>

        <div className="p-5 border-t border-stone-200 flex gap-2 sticky bottom-0 bg-white">

            onClick={() => canSave && onSave(form)}

            className="btn-primary flex-1 px-4 py-2.5 rounded-lg font-semibold text-sm flex items-center justify-center gap-2"
