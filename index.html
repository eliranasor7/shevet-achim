  );
}

/* ----- Admin: Picking Modal ----- */

// New unit model:
//   orderUnit:   how the customer orders this product. 'kg' = decimal weight, 'units' = whole count
//   billingUnit: how it's billed (sent to Comax). 'kg' = column D weight, 'units' = column K count
// Examples:
//   - Premium ribeye: orderUnit=units (10 cuts), billingUnit=kg (weighed at picking)
//   - Liver: orderUnit=kg (5 kg), billingUnit=kg (weighed at picking)
//   - Pre-packaged sausages: orderUnit=units (50 packs), billingUnit=units (50 packs charged)
function getOrderUnit(product) {
  if (!product) return 'units';
  return product.orderUnit || 'units';
}
function getBillingUnit(product) {
  if (!product) return 'kg';
  return product.billingUnit || 'kg';
}
// Show this label next to the order quantity ("ק״ג" / "יחידות")
function orderUnitLabel(product) {
  return getOrderUnit(product) === 'kg' ? 'ק״ג' : 'יח׳';
}

// Per-item unit override:
// Customer can choose 'kg' or 'units' when adding to cart.
// If the order item has its own `unit` set, it overrides the product's default orderUnit.
// Falls back gracefully for legacy orders that don't have item.unit set.
function getItemUnit(item, product) {
  if (item && item.unit) return item.unit;
  return getOrderUnit(product);
}
function itemUnitLabel(item, product) {
  return getItemUnit(item, product) === 'kg' ? 'ק״ג' : 'יח׳';
}

// Backwards-compatible: returns true if the product is BILLED by weight (the picker must weigh it).
// Most existing code uses this to decide whether the picker needs to enter a final weight.
function isWeightProduct(product) {
  return getBillingUnit(product) === 'kg';
}

function PickingModal({ order, data, onClose, onSave, categoryFilter, deptInfo }) {
  const client = data.clients.find(c => c.id === order.clientId);
  const isWorker = !!categoryFilter;
  // For workers: only items in their department are visible/pickable.
  // Items outside the dept retain their existing pickedQty/pickedUnits unchanged.
  const visibleItems = isWorker
    ? order.items.filter(it => itemMatchesCategory(it, data.products, categoryFilter))
    : order.items;
  // Selected item ids for combined-label printing (multi-select)
  const [selectedIds, setSelectedIds] = useState(new Set());
  const toggleSelect = (productId) => {
    setSelectedIds(prev => {
      const next = new Set(prev);
      if (next.has(productId)) next.delete(productId); else next.add(productId);
      return next;
    });
  };
  const clearSelection = () => setSelectedIds(new Set());

  // Per-item state. Manager types both fields directly:
  //   units:  string — picked unit count (typed). Empty means "not entered".
  //   weight: string — total weight in kg (only meaningful for weight products).
  const [picked, setPicked] = useState(() => {
    const init = {};
    order.items.forEach(item => {
      const p = data.products.find(pr => pr.id === item.productId);
      const u = typeof item.pickedUnits === 'number'
        ? item.pickedUnits
        : (item.pickedQty != null && !isWeightProduct(p) ? item.pickedQty : '');
      const w = isWeightProduct(p) && item.pickedQty != null ? String(item.pickedQty) : '';
      init[item.productId] = { units: u === '' ? '' : String(u), weight: w };
    });
    return init;
  });

  // Allow only digits for unit count (integer)
  const sanitizeInt = (v) => v.replace(/[^\d]/g, '');
  // Allow digits + single decimal for weight
  const sanitizeDec = (v) => {
    const s = v.replace(/[^\d.]/g, '');
    const parts = s.split('.');
    return parts.length > 2 ? parts[0] + '.' + parts.slice(1).join('') : s;
  };

  const setUnits = (productId, value) => {
    setPicked(prev => ({ ...prev, [productId]: { ...prev[productId], units: sanitizeInt(value) } }));
  };
  const setWeight = (productId, value) => {
    setPicked(prev => ({ ...prev, [productId]: { ...prev[productId], weight: sanitizeDec(value) } }));
  };

  const fillAll = () => {
    const next = { ...picked };
    // Workers: only fill their dept's items. Admin: fill all.
    visibleItems.forEach(item => {
      const p = data.products.find(pr => pr.id === item.productId);
      const cur = picked[item.productId] || {};
      const ou = getOrderUnit(p);
      const bu = getBillingUnit(p);
      // Default the units field to the order qty only if order is in units
      // For kg orders that bill in kg, prefill the weight too (customer's order qty is the target)
      next[item.productId] = {
        units: ou === 'units' ? String(item.quantity) : (cur.units || ''),
        weight: bu === 'kg' ? (cur.weight || (ou === 'kg' ? String(item.quantity) : '')) : '',
      };
    });
    setPicked(next);
  };

  const clearAll = () => {
    if (!confirm(isWorker
      ? `למחוק את הליקוט של פריטי ${deptInfo?.short || 'מחלקתך'} בלבד?`
      : 'למחוק את כל הליקוט שהוזן?')) return;
    const cleared = { ...picked };
    visibleItems.forEach(item => {
      cleared[item.productId] = { units: '', weight: '' };
    });
    setPicked(cleared);
  };

  // Helpers to read parsed values
  const parsedUnits = (id) => {
    const v = picked[id]?.units;
    if (v === '' || v == null) return null;
    const n = parseInt(v, 10);
    return isNaN(n) ? null : n;
  };
  const parsedWeight = (id) => {
    const v = picked[id]?.weight;
    if (v === '' || v == null) return null;
    const n = parseFloat(v);
    return isNaN(n) ? null : n;
  };

  // An item is "filled" if it has at least one of units/weight entered
  const isItemFilled = (item) => {
    const u = parsedUnits(item.productId);
    const w = parsedWeight(item.productId);
    return (u != null && u > 0) || (w != null && w > 0);
  };
  const isItemComplete = (item) => {
    const p = data.products.find(pr => pr.id === item.productId);
    const u = parsedUnits(item.productId);
    if (u == null || u <= 0) return false;
    if (isWeightProduct(p)) {
      const w = parsedWeight(item.productId);
      return w != null && w > 0;
    }
    return true;
  };

  const completedCount = visibleItems.filter(isItemComplete).length;
  const progress = visibleItems.length === 0 ? 0 : completedCount / visibleItems.length;
  const hasAny = visibleItems.some(isItemFilled);
  const canSave = hasAny;

  const save = () => onSave(buildUpdatedOrder());
  const saveAndExport = () => {
    const updated = buildUpdatedOrder();
    onSave(updated);
    const c = data.clients.find(cl => cl.id === updated.clientId);
    exportPickingToExcel(updated, c, data.products);
  };

  function buildUpdatedOrder() {
    const items = order.items.map(item => {
      const p = data.products.find(pr => pr.id === item.productId);
      const u = parsedUnits(item.productId);
      const w = parsedWeight(item.productId);
      // Nothing entered — clear prior values
      if ((u == null || u === 0) && (w == null || w === 0)) {
        const { pickedQty, pickedUnits, ...rest } = item;
        return rest;
      }
      const newItem = { ...item };
      if (u != null && u > 0) newItem.pickedUnits = u;
      else                    delete newItem.pickedUnits;

      if (isWeightProduct(p)) {
        // Weight product: pickedQty = the weight (kg) → goes to Excel col D
        if (w != null && w > 0) newItem.pickedQty = w;
        else                    delete newItem.pickedQty;
      } else {
        // Unit product: pickedQty equals the unit count (so reports show qty)
        if (u != null && u > 0) newItem.pickedQty = u;
        else                    delete newItem.pickedQty;
      }
      return newItem;
    });
    return {
      ...order,
      items,
      pickedAt: new Date().toISOString(),
      status: order.status === 'pending' ? 'processing' : order.status,
    };
  }

  const shortId = '#' + order.id.slice(0, 5).toUpperCase();

  return (
    <div className="fixed inset-0 z-50 bg-white flex flex-col fade-up">
      {/* Header */}
      <header className="border-b border-neutral-200 flex-shrink-0" style={{ borderColor: '#E5E5E5' }}>
        <div className="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
          <div className="flex items-center gap-3 min-w-0">
            <button onClick={onClose}
                    className="p-2 rounded-lg hover:bg-neutral-100 flex-shrink-0"
                    title="סגירה">
              <X size={20} />
            </button>
            <div className="min-w-0 flex items-center gap-2">
              <ClientAvatar client={client} size="sm" />
              <div className="min-w-0">
                <div className="font-display text-base font-bold leading-tight truncate" style={{ color: '#111111' }}>
                  ליקוט {shortId}
                </div>
                <div className="text-xs truncate" style={{ color: '#737373' }}>
                  {client?.brand ? `${client.brand} · ${client.name}` : client?.name}
                </div>
              </div>
            </div>
          </div>
          <div className="text-sm font-bold flex-shrink-0" style={{ color: '#111111' }}>
            {completedCount}/{visibleItems.length}
          </div>
        </div>
        {/* Progress bar */}
        <div className="h-1 bg-neutral-100" style={{ background: '#F5F5F5' }}>
          <div className="h-full transition-all"
               style={{
                 width: `${progress * 100}%`,
                 background: '#D21E26',
               }} />
        </div>
      </header>

      {/* Main */}
      <main className="flex-1 overflow-y-auto">
        <div className="max-w-3xl mx-auto px-4 py-4">
          {/* Order-level note banner from client */}
          {order.notes && (
            <div className="mb-4 p-3 rounded-lg border flex gap-2"
                 style={{ background: '#FEF2F2', borderColor: '#FCA5A5' }}>
              <MessageSquare size={16} style={{ color: '#991B1B' }} className="flex-shrink-0 mt-0.5" />
              <div className="text-sm" style={{ color: '#991B1B' }}>
                <div className="font-bold text-xs mb-0.5">הערה מהלקוח:</div>
                {order.notes}
              </div>
            </div>
          )}

          {/* Quick actions */}
          <div className="flex gap-2 mb-4 flex-wrap">
            <button
              onClick={fillAll}
              className="px-3 py-2 rounded-lg text-sm font-semibold border border-neutral-300 bg-white hover:bg-neutral-50 flex items-center gap-1.5"
              style={{ color: '#111111', borderColor: '#D4D4D4' }}
            >
              <ListChecks size={15} />
              סמן הכל כנלקט
            </button>
            {hasAny && (
              <button
                onClick={clearAll}
                className="px-3 py-2 rounded-lg text-sm font-semibold border border-neutral-300 bg-white hover:bg-red-50 flex items-center gap-1.5"
                style={{ color: '#B91C1C', borderColor: '#D4D4D4' }}
              >
                <Trash2 size={15} />
                ניקוי
              </button>
            )}
          </div>

          {/* Selection toolbar — appears when 2+ items selected */}
          {selectedIds.size >= 1 && (
            <div className="sticky top-2 z-10 mb-3 rounded-xl border p-2.5 card-shadow flex items-center gap-2 flex-wrap fade-up"
                 style={{ background: '#111111', borderColor: '#111111' }}>
              <span className="text-sm font-bold text-white px-2">
                {selectedIds.size} {selectedIds.size === 1 ? 'נבחר' : 'נבחרו'}
              </span>
              {selectedIds.size >= 2 ? (
                <button
                  onClick={() => {
                    // Build snapshots of selected items reflecting current picking state
                    const items = order.items
                      .filter(i => selectedIds.has(i.productId))
                      .map(i => {
                        const u = parsedUnits(i.productId);
                        const w = parsedWeight(i.productId);
                        const p = data.products.find(pr => pr.id === i.productId);
                        const snap = { ...i };
                        if (u != null && u > 0) snap.pickedUnits = u;
                        if (isWeightProduct(p) && w != null && w > 0) snap.pickedQty = w;
                        else if (!isWeightProduct(p) && u != null && u > 0) snap.pickedQty = u;
                        return snap;
                      });
                    printCombinedItemsLabel(items, data.products, client, order);
                  }}
                  className="text-xs font-bold rounded-md px-3 py-1.5 flex items-center gap-1.5"
                  style={{ background: '#D8B4FE', color: '#581C87' }}
                >
                  <Printer size={13} />
                  מדבקת קרטון מאוחדת
                </button>
              ) : (
                <span className="text-xs text-white opacity-70 px-2">
                  סמן עוד פריט למדבקה מאוחדת
                </span>
              )}
              <div className="flex-1" />
              <button onClick={clearSelection}
                      className="text-xs font-semibold text-white opacity-70 hover:opacity-100 px-2">
                בטל סימון
              </button>
            </div>
          )}

          {/* Department banner for workers */}
          {isWorker && (
            <div className="mb-3 px-3 py-2.5 rounded-lg flex items-center gap-2.5 border-2"
                 style={{ background: deptInfo?.bg || '#FEF3C7', borderColor: deptInfo?.accent || '#B45309' }}>
              <span className="text-2xl">{deptInfo?.emoji || '📦'}</span>
              <div className="flex-1 min-w-0">
                <div className="text-sm font-bold" style={{ color: deptInfo?.accent || '#B45309' }}>
                  ליקוט {deptInfo?.label || 'מחלקה'}
                </div>
                <div className="text-xs" style={{ color: deptInfo?.accent || '#B45309' }}>
                  {visibleItems.length} {visibleItems.length === 1 ? 'פריט' : 'פריטים'} שייכים למחלקתך · פריטים אחרים בהזמנה לא מוצגים
                </div>
              </div>
            </div>
          )}

          {/* Items */}
          <div className="space-y-2">
            {visibleItems.map((item) => {
              const p = data.products.find(pr => pr.id === item.productId);
              const s = picked[item.productId] || { units: '', weight: '' };
              const isWeight = isWeightProduct(p);
              const u = parsedUnits(item.productId);
              const w = parsedWeight(item.productId);
              const hasUnits = u != null && u > 0;
              const hasWeight = w != null && w > 0;
              const filled = hasUnits || hasWeight;
              const complete = isWeight ? (hasUnits && hasWeight) : hasUnits;
              const expiry = getExpiryInfo(p?.productionDate, p);

              const borderColor = complete ? '#059669' : (filled ? '#D21E26' : '#E5E5E5');
              const bgTint = complete ? '#F0FDF4' : 'white';

              return (
                <div key={item.productId}
                     className="rounded-xl border p-3 card-shadow"
                     style={{ borderColor, background: bgTint }}>
                  {/* Top: checkbox + emoji + name + ordered qty + status badge + label button */}
                  <div className="flex items-center gap-3">
                    {/* Multi-select checkbox for combined labels */}
                    <input
                      type="checkbox"
                      checked={selectedIds.has(item.productId)}
                      onChange={() => toggleSelect(item.productId)}
                      className="flex-shrink-0 w-5 h-5 cursor-pointer"
                      style={{ accentColor: '#D21E26' }}
                      title="בחר למדבקה מאוחדת"
                    />
                    <div className="w-11 h-11 rounded-lg flex items-center justify-center text-2xl flex-shrink-0"
                         style={{ background: '#FEF2F2' }}>
                      {p?.emoji || '📦'}
                    </div>
                    <div className="flex-1 min-w-0">
                      <div className="font-display font-bold text-sm leading-tight" style={{ color: '#111111' }}>
                        {p?.name || 'מוצר'}
                      </div>
                      <div className="text-xs flex items-center gap-1.5 flex-wrap mt-0.5" style={{ color: '#737373' }}>
                        {p?.sku && <span className="font-mono" dir="ltr">#{p.sku}</span>}
                        {p?.sku && <span>·</span>}
                        <span className="font-bold" style={{ color: '#111111' }}>
                          הוזמן: {item.quantity} {orderUnitLabel(p)}
                        </span>
                        {(() => {
                          const ou = getOrderUnit(p);
                          const bu = getBillingUnit(p);
                          // Mixed mode: ordered by units, billed by kg → picker prepares units, manager weighs for billing
                          if (ou === 'units' && bu === 'kg') {
                            return (
                              <span className="text-[10px] font-bold px-1.5 py-[1px] rounded"
                                    style={{ background: '#FEF3C7', color: '#B45309' }}
                                    title="מוזמן ביחידות, מחויב לפי משקל - הליקטן מכין את הכמות, המנהל שוקל לחיוב">
                                🔢→⚖️ הכן יח׳, חייב בק״ג
                              </span>
                            );
                          }
                          if (bu === 'kg') {
                            return (
                              <span className="text-[10px] font-bold px-1.5 py-[1px] rounded"
                                    style={{ background: '#DBEAFE', color: '#1E40AF' }}
                                    title="פריט שקיל - יש להזין משקל סופי">⚖️ שקילה</span>
                            );
                          }
                          return null;
                        })()}
                      </div>
                    </div>
                    <div className="flex-shrink-0 flex items-center gap-1.5">
                      {/* Per-item label print buttons — show when item has data filled */}
                      {filled && (
                        <>
                          <button
                            onClick={(e) => {
                              e.stopPropagation();
                              const u = parsedUnits(item.productId);
                              const w = parsedWeight(item.productId);
                              const snapshot = { ...item };
                              if (u != null && u > 0) snapshot.pickedUnits = u;
                              if (isWeight && w != null && w > 0) snapshot.pickedQty = w;
                              else if (!isWeight && u != null && u > 0) snapshot.pickedQty = u;
                              // Print one item label per picked unit (or 1 if none)
                              const count = (u && u > 0) ? u : 1;
                              printItemLabel(snapshot, p, client, order, count);
                            }}
                            className="rounded-md px-2 py-1 hover:bg-blue-50 border text-[10px] font-bold flex items-center gap-1"
                            style={{ borderColor: '#93C5FD', color: '#1E40AF' }}
                            title="הדפס מדבקות פריט (5x5 ס״מ) לכל יחידה"
                          >
                            <Printer size={11} /> פריט
                          </button>
                          <button
                            onClick={(e) => {
                              e.stopPropagation();
                              const u = parsedUnits(item.productId);
                              const w = parsedWeight(item.productId);
                              const snapshot = { ...item };
                              if (u != null && u > 0) snapshot.pickedUnits = u;
                              if (isWeight && w != null && w > 0) snapshot.pickedQty = w;
                              else if (!isWeight && u != null && u > 0) snapshot.pickedQty = u;
                              printSingleItemLabel(snapshot, p, client, order);
                            }}
                            className="rounded-md px-2 py-1 hover:bg-purple-50 border text-[10px] font-bold flex items-center gap-1"
                            style={{ borderColor: '#D8B4FE', color: '#6B21A8' }}
                            title="הדפס מדבקת קרטון (10x10 ס״מ)"
                          >
                            <Printer size={11} /> קרטון
                          </button>
                        </>
                      )}
                      {complete ? (
                        <div className="text-[11px] font-bold px-2 py-1 rounded-full inline-flex items-center gap-1"
                             style={{ background: '#D1FAE5', color: '#065F46' }}>
                          <Check size={12} /> נלקט
                        </div>
                      ) : filled ? (
                        <div className="text-[11px] font-bold px-2 py-1 rounded-full"
                             style={{ background: '#FEF3C7', color: '#B45309' }}>
                          חלקי
                        </div>
                      ) : null}
                    </div>
                  </div>

                  {/* Per-item note from client */}
                  {item.note && (
                    <div className="mt-2.5 px-3 py-2 rounded-lg border flex items-center gap-2"
                         style={{ background: '#FEF9C3', borderColor: '#FDE68A' }}>
                      <MessageSquare size={14} style={{ color: '#B45309' }} className="flex-shrink-0" />
                      <div className="text-sm font-bold" style={{ color: '#78350F' }}>
                        {item.note}
                      </div>
                    </div>
                  )}

                  {/* Expiry warning if relevant */}
                  {expiry.status === 'soon' || expiry.status === 'expired' ? (
                    <div className="mt-2 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5"
                         style={{ background: expiry.bg, color: expiry.color, border: `1px solid ${expiry.border}` }}>
                      <Calendar size={12} /> {expiry.label}
                    </div>
                  ) : null}

                  {/* Two input fields: units count + weight (only for weight products) */}
                  <div className="mt-3 grid grid-cols-2 gap-2">
                    {/* Units (always visible — picker fills this) */}
                    <div className="rounded-lg p-2.5"
                         style={{
                           background: hasUnits ? '#F0FDF4' : '#F9FAFB',
                           border: `1px solid ${hasUnits ? '#86EFAC' : '#E5E7EB'}`,
                         }}>
                      <div className="text-[10px] font-bold uppercase tracking-wider mb-1"
                           style={{ color: hasUnits ? '#065F46' : '#737373' }}>
                        🔢 יחידות שנלקטו
                      </div>
                      <input
                        type="text"
                        inputMode="numeric"
                        value={s.units}
                        onChange={e => setUnits(item.productId, e.target.value)}
                        placeholder="—"
                        className="w-full rounded-md px-2 py-2 text-lg font-display font-bold text-center"
                        style={{
                          border: `2px solid ${hasUnits ? '#059669' : '#D4D4D4'}`,
                          background: 'white',
                          color: '#111111',
                        }}
                        dir="ltr"
                      />
                    </div>

                    {/* Weight (only for kg-billed products) — manager weighs and enters kg for billing */}
                    {isWeight ? (
                      <div className="rounded-lg p-2.5"
                           style={{
                             background: hasWeight ? '#EFF6FF' : '#FEF9C3',
                             border: `1px solid ${hasWeight ? '#BFDBFE' : '#FDE68A'}`,
                           }}>
                        <div className="text-[10px] font-bold uppercase tracking-wider mb-1 flex items-center gap-1"
                             style={{ color: hasWeight ? '#1E40AF' : '#92400E' }}>
                          <Scale size={11} /> משקל לחיוב (ק״ג)
                        </div>
                        <input
                          type="text"
                          inputMode="decimal"
                          value={s.weight}
                          onChange={e => setWeight(item.productId, e.target.value)}
                          placeholder="—"
                          className="w-full rounded-md px-2 py-2 text-lg font-display font-bold text-center"
                          style={{
                            border: `2px solid ${hasWeight ? '#3B82F6' : '#F59E0B'}`,
                            background: 'white',
                            color: '#111111',
                          }}
                          dir="ltr"
                        />
                      </div>
                    ) : (
                      <div className="rounded-lg p-2.5 flex items-center justify-center text-[11px] text-center"
                           style={{ background: '#F9FAFB', border: '1px dashed #E5E7EB', color: '#A3A3A3' }}>
                        מחויב לפי יחידות
                      </div>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </main>

      {/* Footer */}
      <footer className="border-t flex-shrink-0 bg-white"
              style={{ borderColor: '#E5E5E5' }}>
        <div className="max-w-3xl mx-auto px-4 py-3 flex gap-2 flex-wrap">
          <button onClick={onClose}
                  className="px-4 py-3 rounded-xl border font-semibold text-sm hover:bg-neutral-50 flex-shrink-0"
                  style={{ borderColor: '#D4D4D4', color: '#111111' }}>
            ביטול
          </button>
          <button
            onClick={save}
            disabled={!canSave}
            className={`${isWorker ? 'btn-primary flex-1 min-w-[180px]' : 'btn-dark flex-shrink-0'} rounded-xl px-4 py-3 font-bold ${isWorker ? 'text-base' : 'text-sm'} flex items-center justify-center gap-1.5`}
          >
            <Check size={isWorker ? 18 : 16} />
            {isWorker ? 'שמור ליקוט' : 'סיום'}
          </button>
          {!isWorker && (
            <button
              onClick={saveAndExport}
              disabled={!canSave}
              className="btn-primary flex-1 min-w-[180px] rounded-xl px-4 py-3 font-bold text-base flex items-center justify-center gap-2"
            >
              <FileSpreadsheet size={18} />
              סיום + ייצוא לאקסל
            </button>
          )}
        </div>
      </footer>
    </div>
  );
}

/* ----- Admin: Clients ----- */

function AdminClients({ data, saveData }) {
  const [editingId, setEditingId] = useState(null);
  const [draftName, setDraftName] = useState('');
  const [draftCompanyId, setDraftCompanyId] = useState('');
  const [draftPhone, setDraftPhone] = useState('');
  const [draftWarehouse, setDraftWarehouse] = useState('1');

  // Order email edit state
  const [editingEmail, setEditingEmail] = useState(false);
  const [emailDraft, setEmailDraft] = useState('');
  const [editingWhatsapp, setEditingWhatsapp] = useState(false);
  const [whatsappDraft, setWhatsappDraft] = useState('');

  const startEdit = (c) => {
    setEditingId(c.id);
    setDraftName(c.name);
    setDraftCompanyId(c.companyId || '');
    setDraftPhone(c.phone || '');
    setDraftWarehouse(c.warehouseCode || '1');
  };

  const saveEdit = () => {
    if (!draftName.trim()) return;
    saveData({
      ...data,
      clients: data.clients.map(c =>
        c.id === editingId
          ? { ...c, name: draftName.trim(), companyId: draftCompanyId.trim(), phone: draftPhone.trim(), warehouseCode: draftWarehouse.trim() || '1' }
          : c
      )
    });
    setEditingId(null);
  };

  const saveEmail = () => {
    const trimmed = emailDraft.trim();
    if (!trimmed || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(trimmed)) {
      alert('כתובת מייל לא תקינה');
      return;
    }
    saveData({ ...data, orderEmail: trimmed });
    setEditingEmail(false);
  };

  const saveWhatsapp = () => {
    const trimmed = whatsappDraft.trim();
    // Allow empty (= disable WhatsApp), or any phone-shaped string
    if (trimmed && !/^[\d+\-\s()]{7,}$/.test(trimmed)) {
      alert('מספר טלפון לא תקין');
      return;
    }
    saveData({ ...data, orderWhatsapp: trimmed });
    setEditingWhatsapp(false);
  };

  return (
    <div>
      <div className="mb-5">
        <h2 className="font-display text-2xl sm:text-3xl font-bold" style={{ color: '#111111' }}>לקוחות</h2>
        <p className="text-sm mt-1" style={{ color: '#737373' }}>שלושת הלקוחות של שבט אחים</p>
      </div>

      <div className="space-y-3">
        {data.clients.map(c => {
          const orderCount = data.orders.filter(o => o.clientId === c.id).length;
          const isEditing = editingId === c.id;

          return (
            <div key={c.id}
                 className="bg-white rounded-xl border card-shadow p-4 flex items-start gap-4"
                 style={{ borderColor: '#E5E5E5' }}>
              <ClientAvatar client={c} size="xl" />
              <div className="flex-1 min-w-0">
                {isEditing ? (
                  <div className="space-y-2.5">
                    <div>
                      <label className="block text-xs font-semibold mb-1" style={{ color: '#737373' }}>שם חברה</label>
                      <input
                        autoFocus
                        value={draftName}
                        onChange={e => setDraftName(e.target.value)}
                        className="input-field w-full rounded-lg px-3 py-2 text-sm"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold mb-1" style={{ color: '#737373' }}>מספר לקוח</label>
                      <input
                        value={draftCompanyId}
                        onChange={e => setDraftCompanyId(e.target.value)}
                        onKeyDown={e => { if (e.key === 'Enter') saveEdit(); if (e.key === 'Escape') setEditingId(null); }}
                        className="input-field w-full rounded-lg px-3 py-2 text-sm font-mono"
                        dir="ltr"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold mb-1 flex items-center gap-1" style={{ color: '#737373' }}>
                        <Phone size={11} style={{ color: '#25D366' }} /> טלפון איש קשר (WhatsApp)
                      </label>
                      <input
                        value={draftPhone}
                        onChange={e => setDraftPhone(e.target.value)}
                        onKeyDown={e => { if (e.key === 'Enter') saveEdit(); if (e.key === 'Escape') setEditingId(null); }}
                        placeholder="למשל: 0501234567"
                        className="input-field w-full rounded-lg px-3 py-2 text-sm font-mono"
                        dir="ltr"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold mb-1" style={{ color: '#737373' }}>
                        קוד מחסן (לתעודת משלוח)
                      </label>
                      <input
                        value={draftWarehouse}
                        onChange={e => setDraftWarehouse(e.target.value)}
                        onKeyDown={e => { if (e.key === 'Enter') saveEdit(); if (e.key === 'Escape') setEditingId(null); }}
                        placeholder="1"
                        className="input-field w-full rounded-lg px-3 py-2 text-sm font-mono"
                        dir="ltr"
                      />
                    </div>
                    <div className="flex gap-2 pt-1">
                      <button onClick={saveEdit}
                              className="btn-primary rounded-lg px-3 py-2 text-sm font-semibold flex items-center gap-1.5">
                        <Check size={15} />

                         style={{ color: c.brand ? '#525252' : '#111111' }}>
                      {c.name}
                    </div>
                    <div className="flex flex-wrap items-center gap-1.5 mt-1">

                        <div className="text-xs font-mono inline-flex items-center gap-1 px-2 py-0.5 rounded"

                    </div>
                  </>
                )}

              {!isEditing && (

                  <Pencil size={16} style={{ color: '#525252' }} />
                </button>
              )}
            </div>
          );
        })}

            הגדרות מייל
          </h3>
        </div>

        <div className="bg-white rounded-xl border card-shadow p-4"
             style={{ borderColor: '#E5E5E5' }}>
          <div className="flex items-start gap-4">

                 style={{ background: '#111111' }}>
              <Mail size={22} />
            </div>

            </div>
            <div className="flex-1 min-w-0">
              <div className="font-display text-base font-bold" style={{ color: '#111111' }}>
                מספר וואטסאפ לקבלת הזמנות
              </div>
              {editingWhatsapp ? (
                <div className="flex items-center gap-2 mt-2 flex-wrap">
                  <input
                    autoFocus
                    type="tel"
                    value={whatsappDraft}
                    onChange={e => setWhatsappDraft(e.target.value)}
                    onKeyDown={e => { if (e.key === 'Enter') saveWhatsapp(); if (e.key === 'Escape') setEditingWhatsapp(false); }}
                    className="input-field rounded-lg px-3 py-1.5 text-sm font-mono flex-1 min-w-[180px]"
                    dir="ltr"
                    placeholder="0501234567"
                  />
                  <button onClick={saveWhatsapp}
                          className="btn-primary rounded-lg px-3 py-1.5 text-sm font-semibold">
                    <Check size={14} />
                  </button>
                  <button onClick={() => setEditingWhatsapp(false)}
                          className="rounded-lg px-3 py-1.5 text-sm font-semibold border"
                          style={{ borderColor: '#D4D4D4' }}>
                    <X size={14} />
                  </button>
                </div>
              ) : (
                <div className="mt-1">
                  <span className="font-mono text-sm px-2 py-0.5 rounded"
                        style={{ background: '#DCFCE7', color: '#111111' }} dir="ltr">
                    {data.orderWhatsapp || '(לא הוגדר)'}
                  </span>
                </div>
              )}
            </div>
            {!editingWhatsapp && (
              <button
                onClick={() => { setEditingWhatsapp(true); setWhatsappDraft(data.orderWhatsapp || ''); }}
                className="p-2 rounded-lg hover:bg-neutral-100"
                title="שינוי מספר">
                <Pencil size={16} style={{ color: '#525252' }} />
              </button>
            )}
          </div>
        </div>

        <div className="mt-3 p-3 rounded-lg border flex gap-2"
             style={{ background: '#DCFCE7', borderColor: '#86EFAC' }}>
          <AlertCircle size={16} style={{ color: '#166534' }} className="flex-shrink-0 mt-0.5" />
          <div className="text-xs leading-relaxed" style={{ color: '#525252' }}>
            כשלקוח שולח הזמנה, יופיע לו כפתור "וואטסאפ" שפותח אצלו את האפליקציה עם כל פרטי
            ההזמנה ועם המספר הזה כיעד. הוא רק מאשר ושולח. השאר ריק כדי לכבות את האפשרות הזאת.
          </div>
        </div>
      </div>
    </div>
  );
}


/* =======================  QUANTITY MODAL (mobile-first popup)  =======================
 * Opens when a customer taps a product in the catalog.
 * - Empty number input with autofocus → triggers phone numeric keyboard immediately
 * - kg/units toggle (defaults to product's orderUnit, customer can override per item)
 * - Optional per-item note
 * - On save, the product is added/updated in the cart with the chosen qty + unit
 */
function QuantityModal({ product, existingQty, existingUnit, existingNote, onSave, onRemove, onClose }) {
  const defaultUnit = existingUnit || getOrderUnit(product);
  const [unit, setUnit] = useState(defaultUnit);
  const [qtyStr, setQtyStr] = useState(existingQty != null && existingQty > 0 ? String(existingQty) : '');
  const [note, setNote] = useState(existingNote || '');
  const inputRef = useRef(null);

  // Auto-focus the input on mount → triggers mobile numeric keyboard immediately.
  // Small delay because focus during initial render can be flaky on iOS Safari.
  useEffect(() => {
    const t = setTimeout(() => {
      try { if (inputRef.current) inputRef.current.focus(); } catch (e) {}
    }, 100);
    return () => clearTimeout(t);
  }, []);

  const allowDecimal = unit === 'kg';

  const sanitize = (v) => {
    if (allowDecimal) {
      const s = v.replace(/[^\d.]/g, '');
      const parts = s.split('.');
      return parts.length > 2 ? parts[0] + '.' + parts.slice(1).join('') : s;
    }
    return v.replace(/[^\d]/g, '');
  };

  const qtyNum = qtyStr === '' ? null
    : (allowDecimal ? parseFloat(qtyStr) : parseInt(qtyStr, 10));
  const isValid = qtyNum != null && !isNaN(qtyNum) && qtyNum > 0;

  const handleSave = () => {
    if (!isValid) return;
    const finalQty = allowDecimal ? Math.round(qtyNum * 100) / 100 : qtyNum;
    onSave({ quantity: finalQty, unit, note: note.trim() });
  };

  const isEditing = existingQty != null && existingQty > 0;

  return (
    <div
      className="fixed inset-0 z-50 bg-black/50 flex items-end sm:items-center justify-center p-0 sm:p-4 fade-up"
      onClick={onClose}
    >
      <div
        className="bg-white rounded-t-2xl sm:rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl"
        onClick={e => e.stopPropagation()}
      >
        {/* Header */}
        <div className="p-4 border-b" style={{ borderColor: '#E5E5E5' }}>
          <div className="flex items-center gap-3">
            <div className="w-12 h-12 rounded-lg flex items-center justify-center text-3xl flex-shrink-0"
                 style={{ background: '#FEF2F2' }}>
              {product.emoji || '📦'}
            </div>
            <div className="flex-1 min-w-0">
              <div className="font-display text-base font-bold leading-tight" style={{ color: '#111111' }}>
                {product.name}
              </div>
              {product.sku && (
                <div className="text-xs font-mono mt-0.5" style={{ color: '#737373' }} dir="ltr">
                  #{product.sku}
                </div>
              )}
            </div>
            <button onClick={onClose}
                    className="p-2 rounded-lg hover:bg-stone-100 flex-shrink-0"
                    aria-label="סגור">
              <X size={20} style={{ color: '#737373' }} />
            </button>
          </div>
        </div>

        {/* Body */}
        <div className="p-5">
          {/* Unit toggle */}
          <div className="mb-4">
            <div className="text-xs font-bold mb-2" style={{ color: '#737373' }}>
              יחידת הזמנה:
            </div>
            <div className="flex gap-2">
              <button
                type="button"
                onClick={() => setUnit('kg')}
                className="flex-1 rounded-lg px-3 py-3 font-bold border-2 transition-all flex items-center justify-center gap-2 text-sm"
                style={{
                  background: unit === 'kg' ? '#1E40AF' : 'white',
                  color: unit === 'kg' ? 'white' : '#525252',
                  borderColor: unit === 'kg' ? '#1E40AF' : '#E5E5E5',
                }}
              >
                <span className="text-base">⚖️</span>
                <span>ק״ג</span>
              </button>
              <button
                type="button"
                onClick={() => setUnit('units')}
                className="flex-1 rounded-lg px-3 py-3 font-bold border-2 transition-all flex items-center justify-center gap-2 text-sm"
                style={{
                  background: unit === 'units' ? '#1C1917' : 'white',
                  color: unit === 'units' ? 'white' : '#525252',
                  borderColor: unit === 'units' ? '#1C1917' : '#E5E5E5',
                }}
              >
                <span className="text-base">🔢</span>
                <span>יחידות</span>
              </button>
            </div>
          </div>

          {/* Quantity input — empty default, auto-focuses to open mobile numeric keyboard */}
          <div className="mb-4">
            <div className="text-xs font-bold mb-2 flex items-center justify-between" style={{ color: '#737373' }}>
              <span>כמות</span>
              <span className="text-[11px]">{unit === 'kg' ? '(ק״ג, אפשר עשרוני)' : '(יחידות שלמות)'}</span>
            </div>
            <input
              ref={inputRef}
              type="text"
              inputMode={allowDecimal ? 'decimal' : 'numeric'}
              pattern={allowDecimal ? '[0-9]*\\.?[0-9]*' : '[0-9]*'}
              value={qtyStr}
              onChange={e => setQtyStr(sanitize(e.target.value))}
              onKeyDown={e => {
                if (e.key === 'Enter' && isValid) handleSave();
              }}
              placeholder=""
              className="w-full input-field rounded-lg px-4 py-4 text-3xl font-display font-bold text-center"
              dir="ltr"
              style={{ minHeight: 64 }}
            />
          </div>

          {/* Optional note */}
          <div className="mb-2">
            <div className="text-xs font-bold mb-2" style={{ color: '#737373' }}>
              הערה (אופציונלי):
            </div>
            <input
              type="text"
              value={note}
              onChange={e => setNote(e.target.value)}
              placeholder="הערה לפריט זה..."
              className="input-field w-full rounded-lg px-3 py-2 text-sm"
            />
          </div>
        </div>

        {/* Footer */}
        <div className="p-3 border-t bg-stone-50 flex gap-2" style={{ borderColor: '#E5E5E5' }}>
          {isEditing && onRemove && (
            <button
              type="button"
              onClick={onRemove}
              className="px-3 py-2.5 rounded-lg border font-semibold text-sm hover:bg-red-50"
              style={{ borderColor: '#FCA5A5', color: '#991B1B' }}
            >
              הסר
            </button>
          )}
          <button
            type="button"
            onClick={onClose}
            className="px-3 py-2.5 rounded-lg border font-semibold text-sm hover:bg-white"
            style={{ borderColor: '#D4D4D4', color: '#525252' }}
          >
            ביטול
          </button>
          <button
            type="button"
            onClick={handleSave}
            disabled={!isValid}
            className="btn-primary flex-1 rounded-lg px-4 py-2.5 font-bold text-sm flex items-center justify-center gap-2"
            style={!isValid ? { opacity: 0.5 } : undefined}
          >
            <Plus size={16} />
            {isEditing ? 'עדכן' : 'הוסף לעגלה'}
          </button>
        </div>
      </div>
    </div>
  );
}


/* =======================  CLIENT VIEW  ======================= */

function ClientView({ data, clientId, saveData, onLogout }) {
  const [tab, setTab] = useState('catalog');
  const [cart, setCart] = useState({});          // { productId: quantity }
  const [itemNotes, setItemNotes] = useState({}); // { productId: note }
  const [itemUnits, setItemUnits] = useState({}); // { productId: 'kg' | 'units' } — per-item unit override
  const [orderNotes, setOrderNotes] = useState('');
  const [ordererName, setOrdererName] = useState('');
  const [deliveryDate, setDeliveryDate] = useState('');
  const [deliveryTime, setDeliveryTime] = useState('');
  const [editingOrderId, setEditingOrderId] = useState(null);
  // After-submit confirmation banner state: { order, emailSent }
  const [justSent, setJustSent] = useState(null);
  // Modal for tapping a product to enter qty + choose unit (mobile-friendly)
  const [modalProduct, setModalProduct] = useState(null);
  const client = data.clients.find(c => c.id === clientId);

  const cartCount = Object.values(cart).reduce((s, q) => s + q, 0);
  const myOrders = useMemo(
    () => data.orders
      .filter(o => o.clientId === clientId)
      .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)),
    [data.orders, clientId]
  );

  // UX: Pre-fill orderer name with the permanent contact person for this client.
  // Falls back to last-used value if no default contact is configured.
  useEffect(() => {
    if (!ordererName) {
      const initial = client?.defaultOrdererName || client?.lastOrdererName || '';
      if (initial) setOrdererName(initial);
    }
  }, [client?.id]);  // only when client changes

  // UX: Smart default delivery date — after 14:00 default to tomorrow, else today
  useEffect(() => {
    if (!deliveryDate && !editingOrderId) {
      const hour = new Date().getHours();
      setDeliveryDate(hour >= 14 ? tomorrowISO() : todayISO());
    }
  }, []);  // only on mount

  const setQty = (productId, qty) => {
    setCart(prev => {
      const next = { ...prev };
      if (qty <= 0) {
        delete next[productId];
        setItemNotes(n => { const nn = { ...n }; delete nn[productId]; return nn; });
        setItemUnits(u => { const uu = { ...u }; delete uu[productId]; return uu; });
      } else {
        next[productId] = qty;
      }
      return next;
    });
  };

  // Set per-item unit override (called from QuantityModal)
  const setItemUnit = (productId, unit) => {
    setItemUnits(prev => {
      const next = { ...prev };
      if (unit) next[productId] = unit;
      else delete next[productId];
      return next;
    });
  };

  // Open the modal for a specific product (called when customer taps a product card)
  const openProductModal = (productId) => {
    const product = data.products.find(p => p.id === productId);
    if (product) setModalProduct(product);
  };
  const closeProductModal = () => setModalProduct(null);

  // Save from the modal: update qty, unit, and note in one go
  const saveFromModal = ({ quantity, unit, note }) => {
    if (!modalProduct) return;
    const productId = modalProduct.id;
    setQty(productId, quantity);
    setItemUnit(productId, unit);
    if (note != null) setItemNote(productId, note);
    closeProductModal();
  };
  // Remove from cart via the modal
  const removeFromModal = () => {
    if (!modalProduct) return;
    setQty(modalProduct.id, 0);
    closeProductModal();
  };

  const setItemNote = (productId, note) => {
    setItemNotes(prev => {
      const next = { ...prev };
      if (note && note.trim()) next[productId] = note;
      else delete next[productId];
      return next;
    });
  };

  const clearCart = () => {
    setCart({});
    setItemNotes({});
    setItemUnits({});
    setOrderNotes('');
    setOrdererName('');
    setDeliveryDate('');
    setDeliveryTime('');
    setEditingOrderId(null);
  };

  const startEditingOrder = (orderId) => {
    const order = data.orders.find(o => o.id === orderId);
    if (!order) return;
    const newCart = {};
    const newNotes = {};
    const newUnits = {};
    order.items.forEach(item => {
      newCart[item.productId] = item.quantity;
      if (item.note) newNotes[item.productId] = item.note;
      if (item.unit) newUnits[item.productId] = item.unit;
    });
    setCart(newCart);
    setItemNotes(newNotes);
    setItemUnits(newUnits);
    setOrderNotes(order.notes || '');
    setOrdererName(order.ordererName || '');
    setDeliveryDate(order.deliveryDate || '');
    setDeliveryTime(order.deliveryTime || '');
    setEditingOrderId(orderId);
    setTab('cart');
  };

  // UX: Reorder — copy items from a past order into a FRESH cart (new order).
  const reorderOrder = (orderId) => {
    const order = data.orders.find(o => o.id === orderId);
    if (!order) return;
    const newCart = {};
    const newNotes = {};
    const newUnits = {};
    order.items.forEach(item => {
      newCart[item.productId] = item.quantity;
      if (item.note) newNotes[item.productId] = item.note;
      if (item.unit) newUnits[item.productId] = item.unit;
    });
    setCart(newCart);
    setItemNotes(newNotes);
    setItemUnits(newUnits);
    setOrderNotes('');  // fresh general note
    // Keep ordererName as-is (from memory or previously typed)
    if (!ordererName && order.ordererName) setOrdererName(order.ordererName);
    // Smart delivery date: keep current default
    setDeliveryTime('');
    setEditingOrderId(null);  // explicitly NOT editing — new order
    setTab('cart');
  };

  const cancelEditing = () => {
    if (!confirm('לבטל את העריכה? השינויים יאבדו.')) return;
    clearCart();
  };

  const submitOrder = () => {
    if (!ordererName.trim() || !deliveryDate) return;
    const items = Object.entries(cart).map(([productId, quantity]) => {
      const note = itemNotes[productId];
      const unit = itemUnits[productId];
      const item = { productId, quantity };
      if (note && note.trim()) item.note = note.trim();
      if (unit) item.unit = unit;
      return item;
    });
    if (items.length === 0) return;

    const baseOrderFields = {
      items,
      ordererName: ordererName.trim(),
      deliveryDate,
      status: 'pending',
    };
    if (orderNotes.trim()) baseOrderFields.notes = orderNotes.trim();
    if (deliveryTime) baseOrderFields.deliveryTime = deliveryTime;

    // UX: Remember this orderer name for next time
    const updatedClients = data.clients.map(c =>
      c.id === clientId ? { ...c, lastOrdererName: ordererName.trim() } : c
    );

    let savedOrder;
    if (editingOrderId) {
      const existing = data.orders.find(o => o.id === editingOrderId);
      if (!existing) return;
      savedOrder = {
        ...existing,
        ...baseOrderFields,
        updatedAt: new Date().toISOString(),
      };
      delete savedOrder.pickedAt;
      savedOrder.items = savedOrder.items.map(i => {
        const { pickedQty, ...rest } = i;
        return rest;
      });
      saveData({
        ...data,
        clients: updatedClients,
        orders: data.orders.map(o => o.id === editingOrderId ? savedOrder : o)
      });
    } else {
      savedOrder = {
        ...baseOrderFields,
        id: uid(),
        clientId,
        createdAt: new Date().toISOString(),
      };
      saveData({ ...data, clients: updatedClients, orders: [savedOrder, ...data.orders] });
    }
    // Keep ordererName in state (don't clear it) so next time it's pre-filled
    setCart({});
    setItemNotes({});
    setItemUnits({});
    setOrderNotes('');
    setDeliveryTime('');
    setEditingOrderId(null);
    // Reset delivery date to smart default for next order
    const hour = new Date().getHours();
    setDeliveryDate(hour >= 14 ? tomorrowISO() : todayISO());
    setTab('orders');
    // Show post-submit banner with email + WhatsApp options.
    // We don't auto-open anything anymore — let the customer pick (avoids
    // browser app-switching mess on mobile, and supports both channels cleanly).
    setJustSent({ order: savedOrder });
    // Auto-dismiss the banner after 30s (longer so customer has time to act)
    setTimeout(() => setJustSent(prev => prev && prev.order?.id === savedOrder.id ? null : prev), 30000);
  };

  if (!client) {
    return (
      <div className="min-h-screen flex items-center justify-center p-6">
        <div className="text-center">
          <div className="mb-3">לקוח לא נמצא</div>
          <button onClick={onLogout} className="btn-primary rounded-lg px-4 py-2 text-sm">חזרה למסך הכניסה</button>
        </div>
      </div>
    );
  }

  const pendingOrdersCount = myOrders.filter(o => ['pending','processing','shipped'].includes(o.status)).length;

  return (
    <div className="min-h-screen pb-10">
      <Header
        roleLabel="הזמנת מוצרים"
        nameLabel={client.name}
        accent={client.color}
        client={client}
        onLogout={onLogout}
      />
      <Tabs
        current={tab}
        onChange={setTab}
        tabs={[
          { id: 'catalog', label: 'קטלוג',         icon: Package },
          { id: 'cart',    label: 'עגלה',          icon: ShoppingCart, badge: cartCount },
          { id: 'orders',  label: 'ההזמנות שלי',  icon: Receipt, badge: pendingOrdersCount },
        ]}
      />
      <main className="max-w-6xl mx-auto px-4 py-5 sm:py-7 fade-up">
        {tab === 'catalog' && <ClientCatalog data={data} cart={cart} setQty={setQty} goToCart={() => setTab('cart')} clientId={clientId} onProductTap={openProductModal} />}
        {tab === 'cart'    && <ClientCart
                                 data={data}
                                 client={client}
                                 cart={cart}
                                 setQty={setQty}
                                 itemNotes={itemNotes}
                                 setItemNote={setItemNote}
                                 orderNotes={orderNotes}
                                 setOrderNotes={setOrderNotes}
                                 ordererName={ordererName}
                                 setOrdererName={setOrdererName}
                                 deliveryDate={deliveryDate}
                                 setDeliveryDate={setDeliveryDate}
                                 deliveryTime={deliveryTime}
                                 setDeliveryTime={setDeliveryTime}
                                 editingOrderId={editingOrderId}
                                 cancelEditing={cancelEditing}
                                 onSubmit={submitOrder}
                                 goToCatalog={() => setTab('catalog')} />}
        {tab === 'orders'  && <ClientOrders
                                 data={data}
                                 orders={myOrders}
                                 onEditOrder={startEditingOrder}
                                 onReorder={reorderOrder} />}
      </main>

      {/* Quantity Modal — opens when a customer taps a product in the catalog */}
      {modalProduct && (
        <QuantityModal
          product={modalProduct}
          existingQty={cart[modalProduct.id]}
          existingUnit={itemUnits[modalProduct.id]}
          existingNote={itemNotes[modalProduct.id]}
          onSave={saveFromModal}
          onRemove={removeFromModal}
          onClose={closeProductModal}
        />
      )}

      {/* Floating banner shown after submitting an order — lets the customer
          send notification via Email and/or WhatsApp to the factory. */}
      {justSent && (
        <div className="fixed bottom-4 left-4 right-4 sm:left-auto sm:right-4 sm:w-[420px] z-40 fade-up">
          <div className="bg-white rounded-2xl border-2 shadow-2xl overflow-hidden"
               style={{ borderColor: '#10B981' }}>
            <div className="px-4 py-3 flex items-center gap-2"
                 style={{ background: '#10B981', color: 'white' }}>
              <PackageCheck size={18} />
              <div className="font-bold text-sm flex-1">הזמנה נשלחה בהצלחה!</div>
              <button onClick={() => setJustSent(null)}
                      className="p-1 rounded hover:bg-white/20"
                      aria-label="סגור">
                <X size={16} />
              </button>
            </div>
            <div className="p-3">
              <div className="text-xs mb-2.5" style={{ color: '#525252' }}>
                שלח הודעת אישור לבית הקצב:
              </div>
              <div className="flex gap-2">
                {data.orderEmail && (
                  <button
                    onClick={() => openOrderEmail(justSent.order, client, data.products, data.orderEmail)}
                    className="flex-1 rounded-lg px-3 py-2.5 font-bold text-sm flex items-center justify-center gap-1.5 border transition-all hover:bg-stone-50"
                    style={{ borderColor: '#D4D4D4', color: '#111111' }}
                  >
                    <Mail size={15} />
                    אימייל
                  </button>
                )}
                {data.orderWhatsapp && (
                  <button
                    onClick={() => openOrderWhatsapp(justSent.order, client, data.products, data.orderWhatsapp)}
                    className="flex-1 rounded-lg px-3 py-2.5 font-bold text-sm flex items-center justify-center gap-1.5 transition-all"
                    style={{ background: '#25D366', color: 'white' }}
                  >
                    <MessageSquare size={15} />
                    וואטסאפ
                  </button>
                )}
                {!data.orderEmail && !data.orderWhatsapp && (
                  <div className="text-xs" style={{ color: '#737373' }}>
                    (אין יעד שליחה מוגדר. בקש מהמנהל להגדיר)
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ----- Client: Catalog ----- */

function ClientCatalog({ data, cart, setQty, goToCart, clientId, onProductTap }) {
  const [search, setSearch] = useState('');
  const [category, setCategory] = useState('all');
  const hasCategories = CATEGORIZED_CLIENTS.has(clientId);
  const client = data.clients.find(c => c.id === clientId);

  const myProducts = data.products.filter(p => p.clientId === clientId && !p.archived);
  const filtered = myProducts.filter(p =>
    (!hasCategories || category === 'all' || getCategory(p) === category) &&
    (!search ||
      p.name.includes(search) ||
      (p.description && p.description.includes(search)) ||
      (p.sku && p.sku.includes(search)))
  );

  // UX: Frequently ordered products for this client — top 8 by total quantity across all past orders
  const recentProducts = useMemo(() => {
    const freqMap = new Map();

function QtyStepper({ quantity, onQtyChange, allowDecimal = false }) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState('');

  const step = allowDecimal ? 0.5 : 1;
  const display = allowDecimal && quantity % 1 !== 0
    ? Number(quantity.toFixed(2))
    : quantity;

  const commit = () => {
    const n = allowDecimal ? parseFloat(draft) : parseInt(draft, 10);
    if (!isNaN(n) && n >= 0) onQtyChange(allowDecimal ? Math.round(n * 100) / 100 : n);
    setEditing(false);
  };

  return (
    <div className="flex items-center gap-1 rounded-lg p-1" style={{ background: '#111111' }}>
      <button
        onClick={() => onQtyChange(Math.max(0, Math.round((quantity - step) * 100) / 100))}
        className="w-8 h-8 rounded-md text-white hover:bg-neutral-700 flex items-center justify-center"
      >
        <Minus size={14} />
      </button>
      {editing ? (
        <input
          autoFocus
          type="text"
          inputMode={allowDecimal ? 'decimal' : 'numeric'}
          value={draft}
          onChange={e => {
            const v = allowDecimal
              ? e.target.value.replace(/[^\d.]/g, '').replace(/(\..*)\./g, '$1')
              : e.target.value.replace(/[^\d]/g, '');
            setDraft(v);
          }}
          onBlur={commit}
          onKeyDown={e => {
            if (e.key === 'Enter') commit();
            if (e.key === 'Escape') setEditing(false);
          }}
          className="font-display font-bold text-white text-center w-14 bg-transparent outline-none"
          style={{ border: 'none', borderBottom: '1px solid rgba(255,255,255,0.4)' }}
        />
      ) : (
        <button
          onClick={() => { setDraft(String(display)); setEditing(true); }}
          className="font-display font-bold text-white min-w-[40px] text-center hover:bg-neutral-700 rounded"
          title="הקלד כמות"
        >
          {display}
        </button>
      )}
      <button
        onClick={() => onQtyChange(Math.round((quantity + step) * 100) / 100)}
        className="w-8 h-8 rounded-md text-white hover:bg-neutral-700 flex items-center justify-center"
      >
        <Plus size={14} />
      </button>
    </div>
  );
}

/* Used in cart — compact light stepper with keyboard entry */
function CartQtyControl({ value, onChange, allowDecimal = false }) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState('');
  const step = allowDecimal ? 0.5 : 1;
  const display = allowDecimal && value % 1 !== 0 ? Number(value.toFixed(2)) : value;

  const commit = () => {
    const n = allowDecimal ? parseFloat(draft) : parseInt(draft, 10);
    if (!isNaN(n) && n >= (allowDecimal ? 0.1 : 1)) {
      onChange(allowDecimal ? Math.round(n * 100) / 100 : n);
    }
    setEditing(false);
  };

  return (
    <div className="flex items-center gap-1 rounded-lg p-1"
         style={{ background: '#F5F5F5' }}>
      <button onClick={() => onChange(Math.max(allowDecimal ? 0.1 : 1, Math.round((value - step) * 100) / 100))}
              className="w-7 h-7 rounded-md bg-white hover:bg-neutral-200 flex items-center justify-center"
              style={{ color: '#111111' }}>
        <Minus size={13} />
      </button>
      {editing ? (
        <input
          autoFocus
          type="text"
          inputMode={allowDecimal ? 'decimal' : 'numeric'}
          value={draft}
          onChange={e => {
            const v = allowDecimal
              ? e.target.value.replace(/[^\d.]/g, '').replace(/(\..*)\./g, '$1')
              : e.target.value.replace(/[^\d]/g, '');
            setDraft(v);
          }}
          onBlur={commit}
          onKeyDown={e => {
            if (e.key === 'Enter') commit();
            if (e.key === 'Escape') setEditing(false);
          }}
          className="font-display font-bold text-sm text-center w-12 bg-white outline-none rounded"
          style={{ border: '1px solid #D21E26', color: '#111111' }}
        />
      ) : (
        <button
          onClick={() => { setDraft(String(display)); setEditing(true); }}
          className="font-display font-bold min-w-[36px] text-center text-sm hover:bg-white rounded px-1"
          style={{ color: '#111111' }}
          title="הקלד כמות"
        >
          {display}
        </button>
      )}
      <button onClick={() => onChange(Math.round((value + step) * 100) / 100)}
              className="w-7 h-7 rounded-md bg-white hover:bg-neutral-200 flex items-center justify-center"
              style={{ color: '#111111' }}>
        <Plus size={13} />
      </button>
    </div>
  );
}

                  ? 'יש למלא את שם המזמין'
                  : missingDate
                  ? 'יש למלא תאריך אספקה'
                  : 'העגלה ריקה')
              : 'תיפתח אפליקציית המייל שלך עם ההזמנה מוכנה לשליחה.'}
          </p>
        </>
      )}
    </div>
  );
}

/* ----- Client: Orders ----- */

function ClientOrders({ data, orders, onEditOrder, onReorder }) {
  const clientId = orders[0]?.clientId;
  const client = data.clients.find(c => c.id === clientId);
  return (
    <div>
      <div className="mb-5">
        <h2 className="font-display text-2xl sm:text-3xl font-bold" style={{ color: '#111111' }}>ההזמנות שלי</h2>
        <p className="text-sm mt-1" style={{ color: '#737373' }}>
          {orders.length} {orders.length === 1 ? 'הזמנה' : 'הזמנות'} עד כה
          {client?.companyId && <span className="font-mono mx-2" dir="ltr">· #{client.companyId}</span>}
        </p>
      </div>

      {orders.length === 0 ? (
        <EmptyState icon={Receipt} title="עדיין לא שלחת הזמנות" description="ההזמנות שתשלח יופיעו כאן" />
      ) : (
        <div className="space-y-3">
          {orders.map(order => (
            <ClientOrderCard
              key={order.id}
              order={order}
              data={data}
              onEdit={() => onEditOrder(order.id)}
              onReorder={() => onReorder(order.id)}
            />
          ))}
        </div>
      )}
    </div>
  );
}

function ClientOrderCard({ order, data, onEdit, onReorder }) {
  const [open, setOpen] = useState(false);
  const itemCount = order.items.reduce((s, i) => s + i.quantity, 0);
  const client = data.clients.find(c => c.id === order.clientId);
  const isEditable = !order.pickedAt && ['pending', 'processing'].includes(order.status);
  const wasUpdated = !!order.updatedAt;

  const resend = (e) => {
    e.stopPropagation();
    openOrderEmail(order, client, data.products, data.orderEmail);
  };

  const handleEdit = (e) => {
    e.stopPropagation();
    onEdit && onEdit();
  };

  const handleReorder = (e) => {
    e.stopPropagation();
    onReorder && onReorder();
  };

  const deliveryDisplay = (() => {
    if (!order.deliveryDate) return null;
    const [y, m, d] = order.deliveryDate.split('-');
    let s = `${d}/${m}/${y}`;
    if (order.deliveryTime) s += ` · ${order.deliveryTime}`;
    return s;
  })();

  return (
    <div className="bg-white rounded-xl border card-shadow overflow-hidden"
         style={{ borderColor: '#E5E5E5' }}>
      <button onClick={() => setOpen(!open)}
              className="w-full p-4 flex items-center gap-3 text-right hover:bg-neutral-50 transition-colors">
        <div className="w-11 h-11 rounded-lg flex items-center justify-center flex-shrink-0"
             style={{ background: '#FEF2F2', color: '#991B1B' }}>
          <Hash size={18} />
        </div>
        <div className="flex-1 min-w-0">
          <div className="flex items-center gap-2 flex-wrap">
            <span className="font-display text-base font-bold" style={{ color: '#111111' }}>
              הזמנה #{order.id.slice(0, 5).toUpperCase()}
            </span>
            <StatusPill status={order.status} size="sm" />
            {wasUpdated && (
              <span className="inline-flex items-center gap-1 font-bold rounded-full border text-[11px] px-2 py-[1px]"
                    style={{ background: '#FEF2F2', color: '#991B1B', borderColor: '#FCA5A5' }}>
                <Edit3 size={10} /> עודכנה
              </span>
            )}
          </div>
          <div className="text-xs sm:text-sm mt-0.5" style={{ color: '#737373' }}>
            {formatDate(order.createdAt)} · {itemCount} {itemCount === 1 ? 'פריט' : 'פריטים'}
          </div>
          {(order.ordererName || deliveryDisplay) && (
            <div className="text-xs mt-1 flex items-center gap-2 flex-wrap" style={{ color: '#525252' }}>
              {order.ordererName && (
                <span className="inline-flex items-center gap-1">
                  <UserCircle size={11} /> {order.ordererName}
                </span>
              )}
              {order.ordererName && deliveryDisplay && <span>·</span>}
              {deliveryDisplay && (
                <span className="inline-flex items-center gap-1">
                  <Calendar size={11} /> {deliveryDisplay}
                </span>
              )}
            </div>
          )}
        </div>
      </button>

      {open && (
        <div className="border-t p-4 fade-up"
             style={{ borderColor: '#E5E5E5', background: '#FAFAFA' }}>

          {order.notes && (
            <div className="mb-3 p-3 rounded-lg border flex gap-2"
                 style={{ background: '#FEF2F2', borderColor: '#FCA5A5' }}>
              <MessageSquare size={14} style={{ color: '#991B1B' }} className="flex-shrink-0 mt-0.5" />
              <div className="text-xs" style={{ color: '#991B1B' }}>
                <div className="font-bold mb-0.5">הערה כללית:</div>
                {order.notes}
              </div>
            </div>
          )}

          <div className="space-y-2 mb-3">
            {order.items.map(item => {
              const p = data.products.find(pr => pr.id === item.productId);
              return (
                <div key={item.productId} className="py-1.5">
                  <div className="flex items-center gap-3">
                    <div className="w-9 h-9 rounded-lg bg-white border flex items-center justify-center text-lg"
                         style={{ borderColor: '#E5E5E5' }}>
                      {p?.emoji || '📦'}
                    </div>
                    <div className="flex-1 min-w-0">
                      <div className="text-sm font-semibold" style={{ color: '#111111' }}>
                        {p?.name || 'מוצר שנמחק'}
                      </div>
                      <div className="text-xs flex items-center gap-1.5 flex-wrap" style={{ color: '#737373' }}>
                        {p?.sku && <span className="font-mono" dir="ltr">#{p.sku}</span>}
                        {p?.sku && p?.unit && <span>·</span>}
                        {p?.unit && <span>{p.unit}</span>}
                      </div>
                    </div>
                    <div className="font-display font-bold text-lg" style={{ color: '#111111' }}>
                      × {item.quantity}
                    </div>
                  </div>
                  {item.note && (
                    <div className="mt-1 mr-12 text-xs flex items-center gap-1.5"
                         style={{ color: '#991B1B' }}>
                      <MessageSquare size={11} className="flex-shrink-0" />
                      <span className="italic">{item.note}</span>
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          <div className="pt-3 border-t flex gap-2 flex-wrap" style={{ borderColor: '#E5E5E5' }}>
            {isEditable && (
              <button onClick={handleEdit}
                      className="btn-primary rounded-lg px-4 py-2.5 text-sm font-semibold flex items-center justify-center gap-2">
                <Edit3 size={15} />
                עדכון הזמנה
              </button>
            )}
            <button onClick={handleReorder}
                    className="rounded-lg px-4 py-2.5 text-sm font-semibold border flex items-center justify-center gap-2"
                    style={{ color: '#D21E26', borderColor: '#D21E26', background: 'white' }}
                    title="יצירת הזמנה חדשה עם אותם פריטים">
              <RotateCw size={15} />
              הזמן שוב
            </button>
          </div>
          {!isEditable && (
            <div className="mt-2 text-[11px] text-center" style={{ color: '#A3A3A3' }}>
              {order.pickedAt ? 'ההזמנה נלקטה ולא ניתן לעדכן אותה' : 'לא ניתן לעדכן הזמנה במצב זה'}
            </div>
          )}
        </div>
      )}
    </div>
  );
}


(function mount() {
  function tryMount() {
    if (typeof React === 'undefined' || typeof ReactDOM === 'undefined') {
      setTimeout(tryMount, 50);
      return;
    }
    try {
      var root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(React.createElement(App));
      var L = document.getElementById('__loading');
      if (L) L.style.display = 'none';
    } catch (e) {
      showError(e.message || e.toString());
    }
  }
  tryMount();
})();
</script>
</body></html>
