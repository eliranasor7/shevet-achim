// Smart emoji guesser for meat / poultry products.
// Order matters: specific keywords first.
function guessEmoji(name) {
  if (/אווז/.test(name))                                                    return '🦆';
  if (/טלה|כבש/.test(name))                                                  return '🐑';
  if (/דג|סלמון|טונה|בקלה|בורי/.test(name))                                return '🐟';
  if (/עוף|פרגית|חזה\s+עוף|חזה\s+חצוי|כנפיים|כרעיים|ירכיים|שניצל|פילה\s+עוף|ברוסט/.test(name)) return '🍗';
  if (/קבב|המבורגר|מרגז|שיפוד/.test(name))                                  return '🍢';
  if (/כבד/.test(name))                                                      return '🫀';
  return '🥩';
}

// Build a mailto: URL for an order, so it opens in the user's email client.
function buildOrderEmail(order, client, products, toAddress) {
  const shortId = '#' + order.id.slice(0, 5).toUpperCase();
  const isPicked = !!order.pickedAt;
  const isUpdated = !isPicked && !!order.updatedAt;
  let subjectPrefix;
  if (isPicked) subjectPrefix = 'דוח ליקוט';
  else if (isUpdated) subjectPrefix = 'עדכון הזמנה';
  else subjectPrefix = 'הזמנה';
  const subject = `${subjectPrefix} ${shortId} · ${client?.name || 'לקוח'}`;

  const lines = order.items.flatMap((item, idx) => {
    const p = products.find(pr => pr.id === item.productId);
    const rows = [];
    if (!p) {
      rows.push(`${idx + 1}. מוצר לא ידוע × ${item.quantity}`);
    } else {
      const sku = p.sku ? ` (#${p.sku})` : '';
      const unit = p.unit ? ` ${p.unit}` : '';
      if (item.pickedQty != null) {
        rows.push(`${idx + 1}. ${p.name}${sku} — הוזמן: ${item.quantity}${unit}, נשלח: ${item.pickedQty}${unit}`);
      } else {
        rows.push(`${idx + 1}. ${p.name}${sku} — ${item.quantity}${unit}`);
      }
    }
    if (item.note) rows.push(`   הערה: ${item.note}`);
    return rows;
  });

  const totalItems = order.items.length;
  const totalUnits = order.items.reduce((s, i) => s + i.quantity, 0);
  const totalPicked = order.items.reduce((s, i) => s + (i.pickedQty != null ? i.pickedQty : 0), 0);

  // Format delivery date/time for Hebrew display
  const deliveryLine = (() => {
    if (!order.deliveryDate) return null;
    const [y, m, d] = order.deliveryDate.split('-');
    let s = `${d}/${m}/${y}`;
    if (order.deliveryTime) s += ` בשעה ${order.deliveryTime}`;
    return s;
  })();

  const bodyLines = [
    isPicked ? `דוח ליקוט` : (isUpdated ? `עדכון הזמנה` : `הזמנה חדשה`),
    ``,
    `לקוח: ${client?.name || '-'}`,
    client?.companyId ? `מספר לקוח: ${client.companyId}` : null,
    order.ordererName ? `שם המזמין: ${order.ordererName}` : null,
    deliveryLine ? `מועד אספקה: ${deliveryLine}` : null,
    `תאריך הזמנה: ${formatDate(order.createdAt)}`,
    isUpdated ? `תאריך עדכון: ${formatDate(order.updatedAt)}` : null,
    isPicked ? `תאריך ליקוט: ${formatDate(order.pickedAt)}` : null,
    `מספר הזמנה: ${shortId}`,
    ``,
    `פריטים:`,
    ...lines,
    ``,
    isPicked
      ? `סה״כ ${totalItems} ${totalItems === 1 ? 'מוצר' : 'מוצרים'} · הוזמן: ${totalUnits}, נשלח: ${Number(totalPicked.toFixed(3))}`
      : `סה״כ: ${totalItems} ${totalItems === 1 ? 'מוצר' : 'מוצרים'}, ${totalUnits} ${totalUnits === 1 ? 'יחידה' : 'יחידות'}`,
    order.notes ? `` : null,
    order.notes ? `הערה כללית: ${order.notes}` : null,
    ``,
    `---`,
    `נשלח ממערכת שבט אחים`,
  ].filter(l => l !== null);
  const body = bodyLines.join('\r\n');

  const url = `mailto:${encodeURIComponent(toAddress)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  return { subject, body, url };
}

function openOrderEmail(order, client, products, toAddress, opts) {
  if (!toAddress) return false;
  const { url } = buildOrderEmail(order, client, products, toAddress);
  // Try to open in a new window first. Browsers/devices without a default mail client
  // will silently fail or open a chooser; we return whether it appeared to succeed.
  try {
    const w = window.open(url, '_blank');
    if (w) {
      // Some browsers return a window even for mailto: that doesn't actually open anything.
      // We can't reliably detect that, so we just trust the open() return value.
      return true;
    }
    // Popup blocked — fall back to navigating the current tab via a temporary <a>
    if (!opts || !opts.silentOnFail) {
      const a = document.createElement('a');
      a.href = url;
      a.target = '_blank';
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      return true;
    }
    return false;
  } catch (e) {
    return false;
  }
}

// --- WhatsApp order delivery ---
// Builds a WhatsApp share URL that opens the user's WhatsApp app with a pre-filled
// order message, ready to be sent to the configured factory phone number.
// Returns { text, url } — same shape as buildOrderEmail for symmetry.
function buildOrderWhatsapp(order, client, products, toPhone) {
  const shortId = '#' + order.id.slice(0, 5).toUpperCase();
  const isPicked = !!order.pickedAt;
  const isUpdated = !isPicked && !!order.updatedAt;

  const headerEmoji = isPicked ? '📋' : (isUpdated ? '✏️' : '🛒');
  const headerText  = isPicked ? 'דוח ליקוט' : (isUpdated ? 'עדכון הזמנה' : 'הזמנה חדשה');

  const lines = order.items.flatMap((item, idx) => {
    const p = products.find(pr => pr.id === item.productId);
    const rows = [];
    if (!p) {
      rows.push(`${idx + 1}. מוצר לא ידוע × ${item.quantity}`);
    } else {
      const sku = p.sku ? ` (#${p.sku})` : '';
      const unit = p.unit ? ` ${p.unit}` : '';
      if (item.pickedQty != null) {
        rows.push(`${idx + 1}. ${p.name}${sku} — הוזמן: ${item.quantity}${unit}, נשלח: ${item.pickedQty}${unit}`);
      } else {
        rows.push(`${idx + 1}. ${p.name}${sku} — ${item.quantity}${unit}`);
      }
    }
    if (item.note) rows.push(`   💬 ${item.note}`);
    return rows;
  });

  const totalItems = order.items.length;
  const totalUnits = order.items.reduce((s, i) => s + i.quantity, 0);

  // Format delivery date/time for Hebrew display
  const deliveryLine = (() => {
    if (!order.deliveryDate) return null;
    const [y, m, d] = order.deliveryDate.split('-');
    let s = `${d}/${m}/${y}`;
    if (order.deliveryTime) s += ` בשעה ${order.deliveryTime}`;
    return s;
  })();

  const bodyLines = [
    `${headerEmoji} *${headerText}* ${shortId}`,
    ``,
    `🏢 *${client?.name || '-'}*`,
    client?.brand ? `(${client.brand})` : null,
    order.ordererName ? `👤 ${order.ordererName}` : null,
    deliveryLine ? `📅 אספקה: ${deliveryLine}` : null,
    ``,
    `*פריטים:*`,
    ...lines,
    ``,
    `📦 סה״כ: ${totalItems} ${totalItems === 1 ? 'מוצר' : 'מוצרים'}`,
    order.notes ? `` : null,
    order.notes ? `📝 הערה: ${order.notes}` : null,
    ``,
    `_נשלח ממערכת שבט אחים_`,
  ].filter(l => l !== null);
  const text = bodyLines.join('\n');

  // wa.me requires international format without leading +; normalize Israeli numbers.
  const normalized = normalizeWhatsAppNumber(toPhone);
  // If a phone is provided, target it directly; otherwise send as a generic share (any contact).
  const url = normalized
    ? `https://wa.me/${normalized}?text=${encodeURIComponent(text)}`
    : `https://wa.me/?text=${encodeURIComponent(text)}`;
  return { text, url };
}

function openOrderWhatsapp(order, client, products, toPhone, opts) {
  // Even without a phone number we can still open WhatsApp's share dialog.
  const { url } = buildOrderWhatsapp(order, client, products, toPhone);
  try {
    const w = window.open(url, '_blank');
    if (w) return true;
    if (!opts || !opts.silentOnFail) {
      const a = document.createElement('a');
      a.href = url;
      a.target = '_blank';
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      return true;
    }
    return false;
  } catch (e) {
    return false;
  }
}

// --- Date utilities (used in cart + reminders) ---
function toISODate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function todayISO() { return toISODate(new Date()); }
function tomorrowISO() { return toISODate(new Date(Date.now() + 86400000)); }
function formatDeliveryDate(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

// --- WhatsApp helpers ---
// Normalize Israeli phone numbers to international format (e.g., 0501234567 -> 972501234567)
function normalizeWhatsAppNumber(phone) {
  if (!phone) return '';
  let clean = String(phone).replace(/[^\d+]/g, '');
  if (clean.startsWith('+')) clean = clean.slice(1);
  else if (clean.startsWith('00')) clean = clean.slice(2);
  else if (clean.startsWith('0')) clean = '972' + clean.slice(1);
  return clean;
}
function buildReminderMessage(client) {
  const brand = client?.brand || client?.name || '';
  return `שלום${brand ? ` ${brand}` : ''}! 👋\n\nתזכורת ידידותית מפופאי הקצב — טרם קיבלנו את ההזמנה שלכם. אשמח אם תוכלו לשלוח את ההזמנה בהקדם.\n\nתודה 🙏`;
}
function openWhatsAppReminder(client) {
  const num = normalizeWhatsAppNumber(client?.phone);
  if (!num) { alert('לא הוגדר מספר טלפון ללקוח זה.'); return; }
  const msg = buildReminderMessage(client);
  const url = `https://wa.me/${num}?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
}

  { he: 'כרעיים',         ml: 'കാലുകൾ' },

  { he: 'כבד אווז',       ml: 'വാത്ത് കരൾ' },

  // Generic chicken keyword
  { he: 'עוף',            ml: 'കോഴി' },

function translateToMalayalam(hebrewName) {
  // Find the first matching keyword and substitute it; otherwise return null.
  for (const entry of MALAYALAM_DICT) {
    if (hebrewName.includes(entry.he)) {
      return entry.ml;
    }
  }
  return null;  // No translation available
}

// Categorize a product as chicken / beef / other based on emoji + name keywords.
// Used for the unified picking report split.
function classifyProduct(p) {
  const emoji = p?.emoji || '';
  const name = p?.name || '';
  const cat = p?.category;
  if (cat === 'chicken') return 'chicken';
  if (cat === 'beef') return 'beef';
  // Emoji-based detection
  if (['🍗','🐔','🐓'].includes(emoji)) return 'chicken';
  if (['🥩','🥓'].includes(emoji)) return 'beef';
  // Keyword fallback
  if (/עוף|פרגית|כנפיים|ירכיים|כרעיים|שניצל|פילה עוף|אווז|כבד עוף/.test(name)) return 'chicken';
  if (/בקר|אנטריקוט|אסאדו|בשר|פילה בקר|טלה|כבש|עגל|טחון|בריסקט|קבב/.test(name)) return 'beef';
  return 'other';
}

// Returns true if the order item belongs to the given department category.
// `category` is one of 'chicken' | 'beef' | 'other' or null/undefined for "no filter".
function itemMatchesCategory(item, products, category) {
  if (!category) return true;
  const p = products.find(pr => pr.id === item.productId);
  return classifyProduct(p) === category;
}

// --- Shelf-life rules ---
// Chicken: 5 days from production. Beef: 10 days. Other: no automatic rule.
const SHELF_LIFE_DAYS = { chicken: 5, beef: 10, other: 0 };

// Compute expiry ISO date from production date + product category.
function computeExpiryDate(productionDateIso, product) {
  if (!productionDateIso) return null;
  const cls = classifyProduct(product);
  const days = SHELF_LIFE_DAYS[cls] || 0;
  if (days === 0) return null;
  const d = new Date(productionDateIso + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return toISODate(d);
}

// Returns { daysLeft, status: 'fresh'|'soon'|'expired'|'none', label, color }
function getExpiryInfo(productionDateIso, product) {
  if (!productionDateIso) return { status: 'none', label: 'לא הוגדר תאריך ייצור' };
  const cls = classifyProduct(product);
  const days = SHELF_LIFE_DAYS[cls] || 0;
  if (days === 0) return { status: 'none', label: 'אין מעקב תוקף לקטגוריה' };
  const expiry = computeExpiryDate(productionDateIso, product);
  if (!expiry) return { status: 'none' };
  const today = new Date(todayISO() + 'T00:00:00');
  const exp = new Date(expiry + 'T00:00:00');
  const diff = Math.round((exp - today) / 86400000);
  if (diff < 0) return { status: 'expired', daysLeft: diff, expiry, label: `פג תוקף לפני ${Math.abs(diff)} ימים`, color: '#991B1B', bg: '#FEE2E2', border: '#FCA5A5' };
  if (diff === 0) return { status: 'soon', daysLeft: 0, expiry, label: 'פג תוקף היום', color: '#B45309', bg: '#FEF3C7', border: '#FDE68A' };
  if (diff <= 2) return { status: 'soon', daysLeft: diff, expiry, label: `פג בעוד ${diff} ${diff === 1 ? 'יום' : 'ימים'}`, color: '#B45309', bg: '#FEF3C7', border: '#FDE68A' };
  return { status: 'fresh', daysLeft: diff, expiry, label: `תקף ${diff} ימים`, color: '#065F46', bg: '#D1FAE5', border: '#6EE7B7' };
}

// --- Print helpers: carton labels + driver delivery sheet ---
function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// Print 10x10 cm labels for every picked item in an order (one label per item).
// Format a YYYY-MM-DD date as DD/MM/YYYY
function formatDMY(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

// Build the inner HTML body for one carton label (10x10 cm).
// `item` is the order item (with pickedQty etc.), `p` is the product, `client` is the client.
// `meta` includes { idx, total, shortId, delivery }
function buildCartonLabelHtml(item, p, client, meta) {
  const emoji = p?.emoji || '📦';
  const name = escapeHtml(p?.name || 'מוצר');
  const sku = p?.sku || '';
  const note = item.note ? escapeHtml(item.note) : '';
  // Production + expiry
  const prodDate = p?.productionDate ? formatDMY(p.productionDate) : null;
  let expiry = null;
  let expiryStatus = null;
  if (p?.productionDate) {
    const e = computeExpiryDate(p.productionDate, p);
    if (e) {
      expiry = formatDMY(e);
      const info = getExpiryInfo(p.productionDate, p);
      expiryStatus = info?.status;
    }
  }
  // Quantity display: show both units and weight when available
  const isW = isWeightProduct(p);
  const u = typeof item.pickedUnits === 'number' ? item.pickedUnits : null;
  const w = isW && item.pickedQty != null ? item.pickedQty : null;
  let qtyHtml;
  if (u != null && w != null) {
    qtyHtml = `<div class="lbl-qty">${u} <span class="lbl-unit">יח׳</span></div>
               <div class="lbl-qty-sub">${Number(w.toFixed(3))} ק״ג</div>`;
  } else if (w != null) {
    qtyHtml = `<div class="lbl-qty">${Number(w.toFixed(3))} <span class="lbl-unit">ק״ג</span></div>`;
  } else if (u != null) {
    qtyHtml = `<div class="lbl-qty">${u} <span class="lbl-unit">יח׳</span></div>`;
  } else if (item.pickedQty != null) {
    qtyHtml = `<div class="lbl-qty">${item.pickedQty} <span class="lbl-unit">${escapeHtml(p?.unit || '')}</span></div>`;
  } else {
    qtyHtml = `<div class="lbl-qty">${item.quantity} <span class="lbl-unit">${escapeHtml(orderUnitLabel(p))}</span></div>`;
  }

  // Prominent dates block — only render if either date exists
  const datesHtml = (prodDate || expiry) ? `
    <div class="lbl-dates-prom">
      ${prodDate ? `
        <div class="dt-box dt-prod">
          <div class="dt-cap">תאריך ייצור</div>
          <div class="dt-val">${prodDate}</div>
        </div>` : ''}
      ${expiry ? `
        <div class="dt-box dt-exp ${expiryStatus === 'expired' ? 'dt-expired' : expiryStatus === 'soon' ? 'dt-soon' : ''}">
          <div class="dt-cap">בתוקף עד</div>
          <div class="dt-val">${expiry}</div>
        </div>` : ''}
    </div>` : '';

  return `
    <div class="lbl">
      <div class="lbl-hdr">
        <span class="lbl-brand">${escapeHtml(client?.brand || '')}</span>
        <span class="lbl-idx">קרטון ${meta.idx + 1}/${meta.total}</span>
      </div>
      <div class="lbl-client">${escapeHtml(client?.name || '')}</div>
      <div class="lbl-prod">
        <div class="lbl-emoji">${emoji}</div>
        <div class="lbl-name">${name}</div>
      </div>
      ${sku ? `<div class="lbl-sku">מק״ט: ${escapeHtml(sku)}</div>` : ''}
      ${qtyHtml}
      ${note ? `<div class="lbl-note">📝 ${note}</div>` : ''}
      ${datesHtml}
      <div class="lbl-ftr">
        <div>${meta.shortId}</div>
        ${meta.delivery ? `<div>${meta.delivery}</div>` : '<div></div>'}
      </div>
    </div>`;
}

// Build a small ITEM label (5x5 cm, prints multiple per A4) — for individual product
// pieces inside a carton. Less detail, focused on identification + dates.
function buildItemLabelHtml(item, p, client, meta) {
  const emoji = p?.emoji || '📦';
  const name = escapeHtml(p?.name || 'מוצר');
  const sku = p?.sku || '';
  const prodDate = p?.productionDate ? formatDMY(p.productionDate) : null;
  let expiry = null;
  let expiryStatus = null;
  if (p?.productionDate) {
    const e = computeExpiryDate(p.productionDate, p);
    if (e) {
      expiry = formatDMY(e);
      const info = getExpiryInfo(p.productionDate, p);
      expiryStatus = info?.status;
    }
  }
  return `
    <div class="ilbl">
      <div class="ilbl-brand">${escapeHtml(client?.brand || '')}</div>
      <div class="ilbl-name">${emoji} ${name}</div>
      ${sku ? `<div class="ilbl-sku">${escapeHtml(sku)}</div>` : ''}
      <div class="ilbl-dates">
        ${prodDate ? `<div><span class="dt-lbl">ייצור:</span> <strong>${prodDate}</strong></div>` : ''}
        ${expiry ? `<div class="${expiryStatus === 'expired' ? 'expired' : expiryStatus === 'soon' ? 'soon' : ''}"><span class="dt-lbl">תוקף:</span> <strong>${expiry}</strong></div>` : ''}
      </div>
    </div>`;
}

// Build a single COMBINED label that lists multiple items together.
// Used when the manager packs several items in the same carton.
function buildCombinedLabelHtml(items, products, client, meta) {
  const lines = items.map(item => {
    const p = products.find(pr => pr.id === item.productId);
    const u = typeof item.pickedUnits === 'number' ? item.pickedUnits : null;
    const w = isWeightProduct(p) && item.pickedQty != null ? item.pickedQty : null;
    let qtyText;
    if (u != null && w != null) qtyText = `${u} יח׳ · ${Number(w.toFixed(3))} ק״ג`;
    else if (w != null)         qtyText = `${Number(w.toFixed(3))} ק״ג`;
    else if (u != null)         qtyText = `${u} יח׳`;
    else if (item.pickedQty != null) qtyText = `${item.pickedQty} ${p?.unit || ''}`;
    else                        qtyText = `${item.quantity} ${orderUnitLabel(p)}`;
    return `
      <div class="cmb-row">
        <div class="cmb-emoji">${p?.emoji || '📦'}</div>
        <div class="cmb-name">${escapeHtml(p?.name || 'מוצר')}${p?.sku ? ` <span class="cmb-sku">#${escapeHtml(p.sku)}</span>` : ''}</div>
        <div class="cmb-qty">${qtyText}</div>
      </div>`;
  }).join('');

  // Find earliest expiry across all items
  let earliestExpiry = null;
  let earliestProd = null;
  let earliestStatus = null;
  items.forEach(item => {
    const p = products.find(pr => pr.id === item.productId);
    if (p?.productionDate) {
      const e = computeExpiryDate(p.productionDate, p);
      if (e && (!earliestExpiry || e < earliestExpiry)) {
        earliestExpiry = e;
        earliestStatus = getExpiryInfo(p.productionDate, p)?.status;
      }
      if (!earliestProd || p.productionDate < earliestProd) earliestProd = p.productionDate;
    }
  });

  return `
    <div class="lbl lbl-cmb">
      <div class="lbl-hdr">
        <span class="lbl-brand">${escapeHtml(client?.brand || '')}</span>
        <span class="lbl-idx">קרטון מאוחד</span>
      </div>
      <div class="lbl-client">${escapeHtml(client?.name || '')}</div>
      <div class="cmb-title">${items.length} פריטים</div>
      <div class="cmb-list">${lines}</div>
      ${(earliestProd || earliestExpiry) ? `
      <div class="lbl-dates-prom">
        ${earliestProd ? `
          <div class="dt-box dt-prod">
            <div class="dt-cap">תאריך ייצור</div>
            <div class="dt-val">${formatDMY(earliestProd)}</div>
          </div>` : ''}
        ${earliestExpiry ? `
          <div class="dt-box dt-exp ${earliestStatus === 'expired' ? 'dt-expired' : earliestStatus === 'soon' ? 'dt-soon' : ''}">
            <div class="dt-cap">בתוקף עד</div>
            <div class="dt-val">${formatDMY(earliestExpiry)}</div>
          </div>` : ''}
      </div>` : ''}
      <div class="lbl-ftr">
        <div>${meta.shortId}</div>
        ${meta.delivery ? `<div>${meta.delivery}</div>` : '<div></div>'}
      </div>
    </div>`;
}

function printLabelsForOrder(order, client, products) {

  if (picked.length === 0) {
    alert('אין פריטים שנלקטו. יש להשלים ליקוט לפני הדפסת מדבקות.');

    : '';
  const totalCount = picked.length;

  const labelHtml = picked.map((item, idx) => {

  const html = `<!DOCTYPE html>

// Print item labels for ALL picked units in an order — useful for labeling each

}

// Build HTML for a department section (chicken or beef). Used in both single + unified reports.
function buildDeptSectionHtml(label, items, products, opts) {
  if (items.length === 0) return '';
  opts = opts || {};
  const showMalayalam = !!opts.showMalayalam;
  const showClient = !!opts.showClient;  // for unified report
  const accent = opts.accent || '#D21E26';

  // Helper: what to SHOW the picker for an item
  // Picker needs the count to prepare; weighing happens later by manager.
  // Returns { displayQty, displayUnit }
  const pickerView = (item, p) => {
    const ou = getOrderUnit(p);
    if (ou === 'kg') {
      // Customer ordered in kg → show that target weight for the picker
      return { qty: item.quantity, unit: 'ק״ג' };
    }
    // Customer ordered in units → show the unit count
    return { qty: item.quantity, unit: 'יח׳' };
  };

  // Group items: in unified mode we group by product across orders, summing picked qty.
  // In single-order mode we just list them as-is.
  const grouped = opts.groupByProduct
    ? (() => {
        const map = new Map();
        items.forEach(({ item, order, client }) => {
          const key = item.productId;
          if (!map.has(key)) map.set(key, { productId: key, total: 0, lines: [] });
          const slot = map.get(key);
          // Sum the ORDERED quantity (what picker needs to prepare)
          slot.total += item.quantity;
          slot.lines.push({ order, client, item });
        });
        return Array.from(map.values()).sort((a, b) => {
          const pa = products.find(p => p.id === a.productId);
          const pb = products.find(p => p.id === b.productId);
          return (pa?.name || '').localeCompare(pb?.name || '', 'he');
        });
      })()
    : null;

  let rowsHtml;
  let totalQty = 0;
  let totalLines = 0;

  if (grouped) {
    rowsHtml = grouped.map(g => {
      const p = products.find(pr => pr.id === g.productId);
      const ml = showMalayalam ? translateToMalayalam(p?.name || '') : null;
      const ou = getOrderUnit(p);
      const headUnit = ou === 'kg' ? 'ק״ג' : 'יח׳';
      totalLines += 1;
      totalQty += g.total;
      const subRows = g.lines.map(l => {
        const c = l.client;
        const brand = c?.brand || c?.name || '—';
        const view = pickerView(l.item, p);
        const note = l.item.note ? `<div class="li-note">📝 ${escapeHtml(l.item.note)}</div>` : '';
        return `<tr class="sub"><td></td><td colspan="2" class="sub-client">↳ ${escapeHtml(brand)}${note}</td><td class="sub-qty">${view.qty} ${view.unit}</td><td></td></tr>`;
      }).join('');
      return `
        <tr class="main">
          <td class="emoji">${p?.emoji || '📦'}</td>
          <td class="name">
            <div>${escapeHtml(p?.name || '—')}</div>
            ${ml ? `<div class="ml">${escapeHtml(ml)}</div>` : ''}
          </td>
          <td class="sku">${escapeHtml(p?.sku || '')}</td>
          <td class="qty"><strong>${Number(g.total.toFixed(3))}</strong> <span class="unit">${headUnit}</span></td>
          <td class="check"></td>
        </tr>
        ${subRows}
      `;
    }).join('');
  } else {
    rowsHtml = items.map(({ item }) => {
      const p = products.find(pr => pr.id === item.productId);
      const view = pickerView(item, p);
      const ml = showMalayalam ? translateToMalayalam(p?.name || '') : null;
      const note = item.note ? `<div class="li-note">📝 ${escapeHtml(item.note)}</div>` : '';
      totalLines += 1;
      totalQty += view.qty;
      return `
        <tr class="main">
          <td class="emoji">${p?.emoji || '📦'}</td>
          <td class="name">
            <div>${escapeHtml(p?.name || '—')}</div>
            ${ml ? `<div class="ml">${escapeHtml(ml)}</div>` : ''}
            ${note}
          </td>
          <td class="sku">${escapeHtml(p?.sku || '')}</td>
          <td class="qty"><strong>${Number(view.qty.toFixed ? view.qty.toFixed(3) : view.qty)}</strong> <span class="unit">${view.unit}</span></td>
          <td class="check"></td>
        </tr>
      `;
    }).join('');
  }

  return `
    <div class="dept" style="--accent: ${accent}">
      <div class="dept-hdr">
        <div class="dept-title">${escapeHtml(label)}</div>
        <div class="dept-meta">${totalLines} ${totalLines === 1 ? 'פריט' : 'פריטים'}</div>
      </div>
      <table>
        <thead><tr>
          <th style="width:6%"></th>
          <th>מוצר</th>
          <th style="width:14%">מק״ט</th>
          <th style="width:18%">כמות להכנה</th>
          <th style="width:8%">✓</th>
        </tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>
  `;
}

// Print a UNIFIED picking report for all orders on a given delivery date,
// split into chicken (with Malayalam) and beef sections, grouped by product
// across all clients.
function printUnifiedPickingReport(orders, clients, products, deliveryDateIso) {
  if (orders.length === 0) { alert('אין הזמנות ליום זה.'); return; }
  const dateLabel = (() => {
    const [y,m,d] = deliveryDateIso.split('-');
    return `${d}/${m}/${y}`;
  })();

  // Flatten all items from all orders, tagged with their order + client
  const allItems = [];
  orders.forEach(order => {
    const client = clients.find(c => c.id === order.clientId);
    order.items.forEach(item => {
      allItems.push({ item, order, client });
    });
  });

  const chickenItems = allItems.filter(x => classifyProduct(products.find(p => p.id === x.item.productId)) === 'chicken');
  const beefItems    = allItems.filter(x => classifyProduct(products.find(p => p.id === x.item.productId)) === 'beef');
  const otherItems   = allItems.filter(x => classifyProduct(products.find(p => p.id === x.item.productId)) === 'other');

  const clientNames = orders.map(o => {
    const c = clients.find(cl => cl.id === o.clientId);
    return c?.brand || c?.name || '—';

  const uniqueClients = [...new Set(clientNames)];

  const html = `<!DOCTYPE html>
<html dir="rtl" lang="he"><head><meta charset="UTF-8"><title>דוח ליקוט מאוחד · ${dateLabel}</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;700&family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">

</style></head>
<body>
  <div class="toolbar">
    <button onclick="window.print()">🖨 הדפס דוח מאוחד</button>
    <button class="sec" onclick="window.close()">סגור</button>
  </div>
  <div class="hdr">
    <div>
      <h1>דוח ליקוט מאוחד</h1>
      <div class="sub">פופאי הקצב · שבט אחים · ליקוט לכל הזמנות היום</div>

// Export picking report to Excel matching the Comax import structure:
// מחסן | לקוח | מק"ט לקוח | כמות | החזרות | מבצע | סכום | בחירה | תאריך | סניף לקוח
// Build the row data for one picked item according to the Comax delivery doc format:
//   Col A — מחסן     (warehouse code)
//   Col B — לקוח     (customer/companyId)
//   Col C — ברקוד    (barcode = SKU)
//   Col D — כמות במשקל   (weight in kg, only for weight products)
//   Col E-J — additional Comax columns kept blank (mark "מבצע", "החזרות" etc.)
//   Col K — כמות ביחידות  (count of physical units)
const COMAX_HEADERS = [
  'מחסן',         // A
  'לקוח',         // B
  'ברקוד',        // C
  'כמות במשקל',   // D — weight in kg
  'החזרות',       // E
  'מבצע',         // F
  'סכום',         // G
  'בחירה',        // H — order reference
  'תאריך',        // I
  'סניף לקוח',    // J
  'כמות ביחידות', // K — units count
];

function buildComaxRow(item, product, client, orderRef, dateStr) {
  const isW = isWeightProduct(product);
  // Weight (only for weight products) — leave blank for unit products
  const weightVal = isW && item.pickedQty != null && !isNaN(parseFloat(item.pickedQty))
    ? Number(parseFloat(item.pickedQty).toFixed(3))
    : '';
  // Units count — pickedUnits if set, else pickedQty for unit products
  const unitsVal = typeof item.pickedUnits === 'number'
    ? item.pickedUnits
    : (!isW && item.pickedQty != null ? item.pickedQty : '');
  return {
    'מחסן':         client?.warehouseCode || '',
    'לקוח':         client?.companyId || '',
    'ברקוד':        product?.sku || '',
    'כמות במשקל':   weightVal,
    'החזרות':       '',
    'מבצע':         '',
    'סכום':         '',
    'בחירה':        orderRef,
    'תאריך':        dateStr,
    'סניף לקוח':    client?.branchCode || '',
    'כמות ביחידות': unitsVal,
  };
}

const COMAX_COL_WIDTHS = [
  { wch: 8 },   // A
  { wch: 14 },  // B
  { wch: 18 },  // C
  { wch: 14 },  // D
  { wch: 8 },   // E
  { wch: 8 },   // F
  { wch: 8 },   // G
  { wch: 12 },  // H
  { wch: 12 },  // I
  { wch: 12 },  // J
  { wch: 14 },  // K
];

// Trigger a browser download of an XLSX workbook
function downloadWorkbook(wb, filename) {
  const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  const blob = new Blob([wbout], {
    type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
  });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 200);
}

// Export ONE order's picking as an Excel file in Comax delivery-doc format.
function exportPickingToExcel(order, client, products) {
  const pickedItems = order.items.filter(i =>
    i.pickedQty != null || (typeof i.pickedUnits === 'number' && i.pickedUnits > 0)
  );
  if (pickedItems.length === 0) {
    alert('אין פריטים שנלקטו. יש להשלים לפחות פריט אחד לפני ייצוא.');
    return;
  }
  // Warn about weight products that don't have a weight entered
  const weightMissing = pickedItems.filter(i => {
    const p = products.find(pr => pr.id === i.productId);
    return isWeightProduct(p) && (i.pickedQty == null || isNaN(parseFloat(i.pickedQty)));
  });
  if (weightMissing.length > 0) {
    const names = weightMissing.map(i => {
      const p = products.find(pr => pr.id === i.productId);
      return p?.name || '?';
    }).join(', ');
    if (!confirm(`חסר משקל סופי לפריטים שקילים: ${names}\n\nלהמשיך בכל זאת ולייצא רק פריטים תקינים?`)) {
      return;
    }
  }

  const d = new Date(order.pickedAt || order.createdAt);
  const dateStr = `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
  const shortId = order.id.slice(0, 5).toUpperCase();

  const rows = pickedItems
    .filter(item => {
      const p = products.find(pr => pr.id === item.productId);
      // Skip weight products without weight (user chose to skip)
      if (isWeightProduct(p) && item.pickedQty == null) return false;
      return true;
    })
    .map(item => {
      const p = products.find(pr => pr.id === item.productId);
      return buildComaxRow(item, p, client, shortId, dateStr);
    });

  const ws = XLSX.utils.json_to_sheet(rows, { header: COMAX_HEADERS });
  ws['!views'] = [{ RTL: true }];
  ws['!cols'] = COMAX_COL_WIDTHS;

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'תעודת משלוח');

  const safeName = (client?.brand || client?.name || 'לקוח').replace(/[\/\\?*:|"<>]/g, '').slice(0, 30);
  downloadWorkbook(wb, `תעודת_משלוח_${safeName}_${shortId}.xlsx`);
}

// Export a UNIFIED Excel for multiple orders. Each client gets its own sheet
// (Comax imports one delivery doc per client), and a "סיכום" sheet lists all of them.
function exportUnifiedPickingToExcel(orders, clients, products, dateLabel) {
  if (orders.length === 0) { alert('אין הזמנות לייצוא.'); return; }

  // Group orders by client
  const byClient = new Map();
  orders.forEach(order => {
    const cid = order.clientId;
    if (!byClient.has(cid)) byClient.set(cid, []);
    byClient.get(cid).push(order);
  });

  // Quick summary count of items
  let totalItemsAcrossOrders = 0;
  let totalWeightMissingItems = 0;
  byClient.forEach((clientOrders, cid) => {
    clientOrders.forEach(order => {
      order.items.forEach(item => {
        if (item.pickedQty != null || (typeof item.pickedUnits === 'number' && item.pickedUnits > 0)) {
          totalItemsAcrossOrders++;
          const p = products.find(pr => pr.id === item.productId);
          if (isWeightProduct(p) && item.pickedQty == null) totalWeightMissingItems++;
        }
      });
    });
  });

  if (totalItemsAcrossOrders === 0) {
    alert('אין פריטים שנלקטו באף הזמנה. יש להשלים ליקוט לפני ייצוא.');
    return;
  }
  if (totalWeightMissingItems > 0) {
    if (!confirm(`חסרים משקלים ב-${totalWeightMissingItems} פריטים שקילים. להמשיך ולדלג עליהם?`)) {
      return;
    }
  }

  const wb = XLSX.utils.book_new();

  // Summary sheet (first)
  const summaryRows = [];
  byClient.forEach((clientOrders, cid) => {
    const c = clients.find(cl => cl.id === cid);
    clientOrders.forEach(order => {
      const pickedCount = order.items.filter(i => i.pickedQty != null || (typeof i.pickedUnits === 'number' && i.pickedUnits > 0)).length;
      const totalQty = order.items.reduce((s, i) => s + (typeof i.pickedUnits === 'number' ? i.pickedUnits : (i.pickedQty || 0)), 0);
      summaryRows.push({
        'לקוח':         c?.brand || c?.name || '?',
        'מס׳ לקוח':     c?.companyId || '',
        'מס׳ הזמנה':    order.id.slice(0, 5).toUpperCase(),
        'מזמין':        order.ordererName || '',
        'תאריך אספקה':  order.deliveryDate ? (() => {
          const [y,m,d] = order.deliveryDate.split('-');
          return `${d}/${m}/${y}` + (order.deliveryTime ? ` ${order.deliveryTime}` : '');
        })() : '',
        'פריטים':       pickedCount,
        'סטטוס':        order.pickedAt ? 'נלקטה' : 'לא נלקטה',
      });
    });
  });
  const summaryWs = XLSX.utils.json_to_sheet(summaryRows);
  summaryWs['!views'] = [{ RTL: true }];
  summaryWs['!cols'] = [{ wch: 24 }, { wch: 12 }, { wch: 12 }, { wch: 16 }, { wch: 16 }, { wch: 10 }, { wch: 12 }];
  XLSX.utils.book_append_sheet(wb, summaryWs, 'סיכום');

  // One sheet per client
  byClient.forEach((clientOrders, cid) => {
    const client = clients.find(cl => cl.id === cid);

    // Flatten all items from this client's orders
    const rows = [];
    clientOrders.forEach(order => {
      const d = new Date(order.pickedAt || order.createdAt);
      const dateStr = `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
      const shortId = order.id.slice(0, 5).toUpperCase();
      order.items.forEach(item => {
        const hasPicked = item.pickedQty != null || (typeof item.pickedUnits === 'number' && item.pickedUnits > 0);
        if (!hasPicked) return;
        const p = products.find(pr => pr.id === item.productId);
        // Skip weight items without weight
        if (isWeightProduct(p) && item.pickedQty == null) return;
        rows.push(buildComaxRow(item, p, client, shortId, dateStr));
      });
    });

    if (rows.length === 0) return;

    const ws = XLSX.utils.json_to_sheet(rows, { header: COMAX_HEADERS });
    ws['!views'] = [{ RTL: true }];
    ws['!cols'] = COMAX_COL_WIDTHS;

    // Sheet name: brand or short company id, sanitized for Excel rules (no /\?*[]:)
    const sheetName = (client?.brand || client?.companyId || 'לקוח')
      .replace(/[\/\\?*\[\]:]/g, '')
      .slice(0, 28);
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
  });

  const safeDate = (dateLabel || todayISO()).replace(/[\/\\?*:|"<>]/g, '-');
  downloadWorkbook(wb, `תעודות_משלוח_${safeDate}.xlsx`);
}

  const [data, setData] = useState(defaultData);
  const [currentUser, setCurrentUser] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    document.documentElement.dir = 'rtl';
    document.documentElement.lang = 'he';
    const link = document.createElement('link');
    link.href = 'https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800;900&display=swap';
    link.rel = 'stylesheet';
    document.head.appendChild(link);
    return () => { try { document.head.removeChild(link); } catch {} };
  }, []);

  useEffect(() => {
    let unsub = null;

    // Helper: parse cloud data and merge with defaults, then update React state
    const handleCloudData = (rawValue) => {
      try {
        const parsed = JSON.parse(rawValue);
        // Merge clients: overlay missing brand/logo/color/phone/warehouseCode/defaultOrderer fields from defaults by id.
        const defaultsById = Object.fromEntries(defaultData.clients.map(c => [c.id, c]));
        const mergedClients = (parsed.clients || defaultData.clients).map(c => {
          const def = defaultsById[c.id] || {};
          return {
            ...c,
            brand: c.brand ?? def.brand,
            logo: c.logo ?? def.logo,
            color: c.color ?? def.color,
            phone: c.phone || def.phone || '',
            warehouseCode: c.warehouseCode ?? def.warehouseCode ?? '1',
            defaultOrdererName:  c.defaultOrdererName  ?? def.defaultOrdererName  ?? '',
            defaultOrdererPhone: c.defaultOrdererPhone ?? def.defaultOrdererPhone ?? '',
          };
        });
        // Merge orders: keep saved orders, inject demo orders that don't exist yet
        const existingOrderIds = new Set((parsed.orders || []).map(o => o.id));
        const missingDemoOrders = (defaultData.orders || []).filter(o => !existingOrderIds.has(o.id));
        const mergedOrders = [...missingDemoOrders, ...(parsed.orders || [])];
        // Migrate products: ensure orderUnit + billingUnit exist
        const mergedProducts = (parsed.products || defaultData.products).map(p => ({
          ...p,
          orderUnit: p.orderUnit || 'units',
          billingUnit: p.billingUnit || 'kg',
        }));
        setData({ ...defaultData, ...parsed, clients: mergedClients, orders: mergedOrders, products: mergedProducts });
      } catch (e) {
        console.error('Failed to parse cloud data:', e);
      }
    };

    (async () => {
      try {
        // First load: get current state from cloud
        const r = await window.storage.get(STORAGE_KEY, true);
        if (r && r.value) {
          handleCloudData(r.value);
        } else {
          // Empty cloud → seed with defaults (first-time setup)
          await window.storage.set(STORAGE_KEY, JSON.stringify(defaultData), true);
        }
      } catch (e) {
        try { await window.storage.set(STORAGE_KEY, JSON.stringify(defaultData), true); } catch {}
      }
      // Load logged-in user (kept local — each device has its own login)
      try {
        const u = await window.storage.get(USER_KEY, false);
        if (u && u.value) setCurrentUser(u.value);
      } catch {}
      setLoading(false);

      // Subscribe to real-time updates from the cloud (cross-device sync)
      // When any device writes to Firestore, all other devices receive the change.
      if (window.storage.onChange) {
        unsub = window.storage.onChange(STORAGE_KEY, (r) => {
          if (r && r.value) handleCloudData(r.value);
        });
      }
    })();

    return () => { if (unsub) unsub(); };
  }, []);

  const saveData = async (newData) => {
    setData(newData);
    try { await window.storage.set(STORAGE_KEY, JSON.stringify(newData), true); }
    catch (e) { console.error('save failed', e); }
  };

  const selectUser = async (user) => {
    setCurrentUser(user);
    try { await window.storage.set(USER_KEY, user, false); } catch {}
  };

  const logout = async () => {
    setCurrentUser(null);
    try { await window.storage.delete(USER_KEY, false); } catch {}
  };

  if (loading) {
    return (
      <div className="min-h-screen flex items-center justify-center font-body" style={{ background: '#FAFAFA', fontFamily: "'Rubik', 'Heebo', sans-serif" }}>
        <div className="text-stone-500">טוען...</div>
      </div>
    );
  }

  return (
    <div dir="rtl" lang="he" className="font-body min-h-screen" style={{ fontFamily: "'Rubik', 'Heebo', sans-serif", background: '#FAFAFA' }}>
      <style>{`
        .font-display { font-family: 'Rubik', 'Heebo', sans-serif; letter-spacing: -0.02em; font-weight: 800; }
        .font-body    { font-family: 'Rubik', 'Heebo', sans-serif; }
        body { margin: 0; background: #FAFAFA; }
        * { -webkit-tap-highlight-color: transparent; }
        .btn-primary {
          background: #D21E26; color: #FFFFFF;
          transition: transform .15s, box-shadow .15s, background .15s;
          box-shadow: 0 1px 2px rgba(210,30,38,.15);
        }
        .btn-primary:hover:not(:disabled) {
          background: #B91C1C;
          box-shadow: 0 4px 14px rgba(210,30,38,.28);
        }
        .btn-primary:active { transform: translateY(1px); }
        .btn-primary:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
        .btn-dark {
          background: #111111; color: #FFFFFF;
          transition: transform .15s, background .15s;
        }
        .btn-dark:hover:not(:disabled) { background: #000000; }
        .btn-dark:active { transform: translateY(1px); }
        .card-shadow { box-shadow: 0 1px 2px rgba(17,17,17,.04), 0 4px 12px rgba(17,17,17,.04); }
        .input-field {
          background: white;
          border: 1.5px solid #E5E5E5;
          transition: border-color .15s, box-shadow .15s;
        }
        .input-field:focus {
          outline: none;
          border-color: #D21E26;
          box-shadow: 0 0 0 3px rgba(210,30,38,.12);
        }
        @keyframes fadeUp { from {opacity:0; transform:translateY(8px)} to {opacity:1; transform:translateY(0)} }
        .fade-up { animation: fadeUp .35s ease-out both; }
      `}</style>

      {!currentUser ? (
        <LoginScreen data={data} onSelect={selectUser} />
      ) : currentUser === 'admin' ? (
        <AdminView data={data} saveData={saveData} onLogout={logout} />
      ) : currentUser === 'worker-chicken' || currentUser === 'worker-beef' ? (
        <WorkerView
          data={data}
          saveData={saveData}
          onLogout={logout}
          department={currentUser === 'worker-chicken' ? 'chicken' : 'beef'}
        />
      ) : (
        <ClientView data={data} clientId={currentUser} saveData={saveData} onLogout={logout} />
      )}
    </div>
  );
}
